schema_version: "1.0"
project: fluente-mente
purpose: Master taxonomy for the seven editorial rubrics of Fluente-Mente.
rules:
  count: 7
  babbel_separate: true
  primary_rubric_per_article: true
  rubric_mission_must_be_distinct: true
  article_must_have_one_primary_rubric: true
  cross_rubric_links_allowed: true
  cross_rubric_links_must_add_a_different_learning_lens: true
rubrics:
  - id: english-in-real-life
    name: English in Real Life
    slug: english-in-real-life
    number: 1
    description_it: "Inglese per affrontare situazioni reali e quotidiane senza bloccarsi."
    mission: "Teach the learner what to say or do in a specific real-life situation."
    promise: "Quando succede questo, so cosa posso dire e come posso reagire."
    question: "What can I say or do when this happens?"
    primary_purpose: communication
    allowed_content_types: [situational_guide, conversation, conversation_breakdown, how_to, problem_scenario, travel_scenario]
    preferred_levels: [A2, A2-B1, B1, B1-B2]
    tone: "practical, clear, reassuring, conversational"
    do:
      - "Focus on one concrete situation and a usable outcome."
      - "Give ready-to-use phrases in natural English."
      - "Show what the learner can actually say in context."
      - "Explain the minimum language needed to handle the situation."
    do_not:
      - "Turn the article into a generic vocabulary list."
      - "Repeat a Natural English article whose main goal is phrasing or register."
      - "Turn the lesson into a grammar-first explanation."
      - "Add Babbel promotion as a substitute for useful teaching."
    default_pillar: /english-in-real-life/
    cta_policy: {default: soft, allowed: [none, soft, contextual], preferred_trigger: "Use a Babbel CTA only when structured practice naturally follows the situation."}
    internal_link_role: "Practical entry point from which learners can continue to naturalness, mindset, culture, travel, work, or real-world usage."
  - id: natural-english
    name: Natural English
    slug: natural-english
    number: 2
    description_it: "Come dire le cose in modo più naturale, spontaneo e meno da libro di scuola."
    mission: "Teach natural phrasing, collocations, register, conversational shortcuts, and non-literal language choices."
    promise: "Non imparo solo cosa è corretto: imparo come suona naturale."
    question: "How would a native speaker naturally say this?"
    primary_purpose: naturalness
    allowed_content_types: [natural_language_analysis, comparison, meaning_in_context, myth_buster, conversation_breakdown]
    preferred_levels: [A2-B1, B1, B1-B2, B2, B2+, C1]
    tone: "natural, precise, modern, conversational"
    do:
      - "Compare textbook English with natural alternatives."
      - "Explain collocations, chunks, contractions, and register."
      - "Show why a phrase may be correct but unnatural in a context."
      - "Use authentic conversational examples."
    do_not:
      - "Teach a situation without making natural phrasing the main lesson."
      - "Become a dictionary of isolated synonyms."
      - "Treat every difference as a strict right/wrong rule."
      - "Duplicate English from the Real World content whose main goal is decoding where English appears."
    default_pillar: /natural-english/
    cta_policy: {default: contextual, allowed: [none, soft, contextual], preferred_trigger: "Offer structured language practice after showing a meaningful natural-language gap."}
    internal_link_role: "Deepens wording and register after a practical situation and can feed work, travel, culture, and real-world comprehension."
  - id: english-mindset
    name: English Mindset
    slug: english-mindset
    number: 3
    description_it: "Strategie per continuare a comunicare anche quando mancano parole o sicurezza."
    mission: "Teach communication strategies, recovery techniques, confidence habits, and ways to keep the conversation moving."
    promise: "Non devo sapere tutto per riuscire a comunicare."
    question: "How can I keep communicating when my English isn't perfect?"
    primary_purpose: confidence
    allowed_content_types: [strategy, mindset_guide, how_to, myth_buster, mini_story]
    preferred_levels: [A2, A2-B1, B1, B1-B2, B2]
    tone: "encouraging, realistic, practical, non-judgmental"
    do:
      - "Teach repair strategies such as asking for repetition or clarification."
      - "Show how to paraphrase when a word is missing."
      - "Normalize pauses, mistakes, and imperfect communication."
      - "Give small strategies the learner can use immediately."
    do_not:
      - "Turn the lesson into motivational content with no usable language."
      - "Repeat the same phrases taught in Real Life unless the communication strategy is different."
      - "Promise fluency through confidence alone."
      - "Use pronunciation or audio as the core learning mechanism."
    default_pillar: /english-mindset/
    cta_policy: {default: soft, allowed: [none, soft, contextual], preferred_trigger: "Use Babbel only when guided practice can reinforce the strategy."}
    internal_link_role: "Supports articles where the main obstacle is hesitation, uncertainty, fear of mistakes, or communication breakdown."
  - id: english-culture
    name: English & Culture
    slug: english-and-culture
    number: 4
    description_it: "Il contesto culturale e sociale che spiega perché l'inglese viene usato in un certo modo."
    mission: "Explain the cultural and social context behind common English expressions, habits, and interaction patterns."
    promise: "Capisco non solo le parole, ma anche il contesto sociale in cui vengono usate."
    question: "Why do English speakers communicate like this?"
    primary_purpose: culture
    allowed_content_types: [cultural_explainer, social_etiquette_guide, meaning_in_context, comparison, myth_buster]
    preferred_levels: [B1, B1-B2, B2, B2+, C1]
    tone: "curious, nuanced, respectful, explanatory"
    do:
      - "Explain social norms that affect language use."
      - "Distinguish cultural tendencies from universal rules."
      - "Connect language choices to social context."
      - "Use examples to prevent stereotypical interpretations."
    do_not:
      - "Present cultural generalizations as absolute facts."
      - "Become a travel guide unless culture is the main point."
      - "Repeat a Natural English lesson without adding social or cultural context."
      - "Reduce culture to lists of trivia."
    default_pillar: /english-and-culture/
    cta_policy: {default: soft, allowed: [none, soft, contextual], preferred_trigger: "Use Babbel when the learner would benefit from broader contextual language practice."}
    internal_link_role: "Adds context to language patterns, especially in social, workplace, travel, and media situations."
  - id: english-for-adventure
    name: English for Adventure
    slug: english-for-adventure
    number: 5
    description_it: "Inglese per viaggiare, muoversi in ambienti nuovi e gestire gli imprevisti."
    mission: "Prepare learners to communicate in travel and unfamiliar environments, especially when plans change or problems occur."
    promise: "In un posto nuovo riesco a cavarmela in inglese anche quando qualcosa non va come previsto."
    question: "What English do I need when I'm away from home?"
    primary_purpose: travel_survival
    allowed_content_types: [travel_scenario, problem_scenario, situational_guide, conversation, how_to]
    preferred_levels: [A2, A2-B1, B1, B1-B2, B2]
    tone: "practical, calm, travel-savvy, reassuring"
    do:
      - "Focus on real communication away from home."
      - "Cover asking for help, clarifying, solving problems, and adapting plans."
      - "Prioritize language with immediate practical value."
      - "Show context-specific phrases rather than giant travel phrasebooks."
    do_not:
      - "Repeat generic travel vocabulary without a scenario."
      - "Treat all travel situations as tourist clichés."
      - "Turn every article into an airport/hotel lesson."
      - "Use pronunciation/audio as the main lesson format."
    default_pillar: /english-for-adventure/
    cta_policy: {default: contextual, allowed: [none, soft, contextual, direct], preferred_trigger: "A direct CTA is appropriate only when structured language preparation clearly matches the travel goal."}
    internal_link_role: "Applies practical English to unfamiliar environments and connects strongly with Real Life, Mindset, Culture, and Real World."
  - id: english-for-life-work
    name: English for Life & Work
    slug: english-for-life-work
    number: 6
    description_it: "Inglese per lavoro, studio, responsabilità quotidiane e comunicazione adulta."
    mission: "Teach English needed for professional, study, and responsibility-heavy adult situations."
    promise: "Posso gestire in inglese situazioni importanti della mia vita adulta, non solo conversazioni informali."
    question: "How can I handle work, study, and adult responsibilities in English?"
    primary_purpose: work_communication
    allowed_content_types: [workplace_guide, career_guide, writing_guide, situational_guide, comparison, how_to]
    preferred_levels: [B1, B1-B2, B2, B2+, C1]
    tone: "professional, practical, clear, confident"
    do:
      - "Focus on realistic workplace, study, and adult-life communication."
      - "Show language for meetings, emails, interviews, requests, and responsibilities."
      - "Balance professionalism with natural spoken English."
      - "Explain the difference between formal, neutral, and relaxed workplace language."
    do_not:
      - "Reduce workplace English to corporate buzzwords."
      - "Repeat generic Natural English comparisons without a work outcome."
      - "Teach grammar separately from a real adult-life task."
      - "Make Babbel the primary subject of the article."
    default_pillar: /english-for-life-work/
    cta_policy: {default: contextual, allowed: [none, soft, contextual, direct], preferred_trigger: "A stronger CTA is appropriate when the learner's goal is sustained language practice for work or study."}
    internal_link_role: "Connects language learning to work, study, writing, confidence, and adult responsibilities."
  - id: english-from-the-real-world
    name: English from the Real World
    slug: english-from-the-real-world
    number: 7
    description_it: "Come capire l'inglese che incontri davvero: messaggi, internet, menu, recensioni, media e vita quotidiana."
    mission: "Help learners decode English as it appears naturally in media, the internet, signs, menus, reviews, messages, and entertainment."
    promise: "Riconosco e capisco l'inglese che incontro davvero fuori dal libro di testo."
    question: "What does this English mean in the real world?"
    primary_purpose: real_world_recognition
    allowed_content_types: [media_language, internet_language, real_world_language, meaning_in_context, conversation_breakdown]
    preferred_levels: [A2-B1, B1, B1-B2, B2, B2+, C1]
    tone: "observational, modern, concrete, explanatory"
    do:
      - "Decode phrases learners encounter outside lessons."
      - "Use realistic examples from messages, media, signs, menus, reviews, and online spaces."
      - "Explain shortened, implied, or context-dependent meaning."
      - "Teach recognition first, then interpretation."
    do_not:
      - "Invent context merely to teach a vocabulary word."
      - "Turn the article into general slang teaching unless real-world context is central."
      - "Repeat a cultural explainer when the main goal is decoding language."
      - "Depend on copyrighted source reproduction; use brief examples and original explanations."
    default_pillar: /english-from-the-real-world/
    cta_policy: {default: soft, allowed: [none, soft, contextual], preferred_trigger: "Use Babbel only when the decoding lesson naturally leads into broader comprehension practice."}
    internal_link_role: "Bridges lessons to the English learners encounter in everyday digital and physical environments."
