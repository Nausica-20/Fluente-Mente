name: Fluente-Mente Writer QA

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "Content ID da generare (opzionale, es. UE-001)"
        required: false
        type: string
  pull_request:
    paths:
      - "_articles/drafts/**"
      - "scripts/validate_articles.py"
      - "prompts/CONTENT_WRITER_ENGINE_PROMPT_v1.md"

jobs:
  writer-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install pyyaml

      - name: Validate article drafts
        run: python scripts/validate_articles.py --root . --fail-on-placeholder

      - name: Upload article QA report
        uses: actions/upload-artifact@v4
        with:
          name: fluente-mente-writer-qa
          path: _articles/qa/WRITER_QA_REPORT.yml
