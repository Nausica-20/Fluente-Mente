name: Validate content schema

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML and article front matter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install validator dependency
        run: python -m pip install --upgrade pip PyYAML

      - name: Run schema validator
        run: python scripts/validate_yml.py --root .

      - name: Run strict validation (informational)
        continue-on-error: true
        run: python scripts/validate_yml.py --root . --strict
