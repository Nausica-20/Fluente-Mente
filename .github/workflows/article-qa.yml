name: Fluente-Mente | structural QA

on:
  pull_request:
    paths:
      - '**/*.md'
      - '_data/**'
      - 'scripts/**'
      - 'schemas/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install YAML dependency
        run: python -m pip install --upgrade pip PyYAML
      - name: Validate physical site
        run: python scripts/validate_yml.py --root .
