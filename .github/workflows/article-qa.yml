name: Fluente-Mente | article QA

on:
  pull_request:
    paths:
      - '_articles/**'
      - '_data/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'prompts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install YAML dependency
        run: python -m pip install --upgrade pip PyYAML

      - name: Validate canonical YAML
        run: python scripts/validate_yml.py --root .
