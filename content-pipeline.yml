name: Fluente-Mente Content Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "_data/**"
      - "scripts/**"
      - "schemas/**"
      - "_articles/**"
      - "prompts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "_data/**"
      - "scripts/**"
      - "schemas/**"
      - "_articles/**"
      - "prompts/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  validate-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install YAML dependency
        run: pip install pyyaml

      - name: Validate canonical YAML
        run: python scripts/validate_yml.py --root .

      - name: Build production packets
        run: python scripts/build_production_packets.py --root . --briefs-index _data/learning_briefs.yml --brief-dir _data/learning_briefs

      - name: Validate production packets
        run: python scripts/validate_production_packets.py --root .

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluente-mente-production-packets
          path: |
            _articles/generated/
            _articles/qa/
