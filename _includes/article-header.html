<header class="article-header">
  <p class="eyebrow">{{ page.domain | replace: '_', ' ' | upcase }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  <div class="article-meta">{% if page.level %}<span>{{ page.level }}</span>{% endif %}{% if page.content_type %}<span>{{ page.content_type }}</span>{% endif %}{% if page.skill %}<span>{{ page.skill | join: ', ' }}</span>{% endif %}</div>
</header>
