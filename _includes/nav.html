<nav class="site-nav" aria-label="Navigazione principale">

  <button
    class="nav-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="primary-menu"
  >
    Menu
  </button>

  <div
    class="nav-menu"
    id="primary-menu"
  >
    {% for item in site.data.site.navigation.header %}
      <a
        class="nav-link{% if page.url == item.url %} is-active{% endif %}"
        href="{{ item.url | relative_url }}"
      >
        {{ item.label }}
      </a>
    {% endfor %}
  </div>

</nav>
