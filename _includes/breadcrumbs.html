<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li>
      <a href="{{ '/' | relative_url }}">Home</a>
    </li>

    {% if page.rubric %}
      {% assign rubric_data = site.data.rubrics.rubrics
        | where: "id", page.rubric
        | first
      %}

      {% if rubric_data %}
        <li aria-hidden="true">/</li>
        <li>
          <a href="{{ rubric_data.default_pillar | relative_url }}">
            {{ rubric_data.name }}
          </a>
        </li>
      {% endif %}
    {% endif %}

    {% if page.title %}
      <li aria-hidden="true">/</li>
      <li aria-current="page">{{ page.title }}</li>
    {% endif %}
  </ol>
</nav>
