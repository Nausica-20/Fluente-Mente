<header class="site-header">

  <div class="container header-inner">

    <!-- Logo -->
    <a
      class="site-logo"
      href="{{ '/' | relative_url }}"
      aria-label="{{ site.data.site.brand.name }} - Home"
    >
      {{ site.data.site.brand.logo_text }}
    </a>


    <!-- Navigazione desktop -->
    <nav
      class="site-nav"
      aria-label="Navigazione principale"
    >

      {% for item in site.data.site.navigation.main %}

        <a
          class="nav-link{% if page.url == item.url %} active{% endif %}"
          href="{{ item.url | relative_url }}"
        >
          {{ item.title }}
        </a>

      {% endfor %}

    </nav>


    <!-- Pulsante menu mobile -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Apri il menu"
      aria-expanded="false"
      aria-controls="mobile-navigation"
      onclick="
        const menu = document.getElementById('mobile-navigation');
        const open = menu.style.display === 'block';
        menu.style.display = open ? 'none' : 'block';
        this.setAttribute('aria-expanded', String(!open));
      "
    >

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>


  <!-- Navigazione mobile -->
  <nav
    id="mobile-navigation"
    class="mobile-nav"
    aria-label="Navigazione mobile"
    style="display: none;"
  >

    <div class="container">

      {% for item in site.data.site.navigation.main %}

        <a
          class="mobile-nav-link{% if page.url == item.url %} active{% endif %}"
          href="{{ item.url | relative_url }}"
        >
          {{ item.title }}
        </a>

      {% endfor %}

    </div>

  </nav>

    </header>
