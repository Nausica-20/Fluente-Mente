title: "Fluente-Mente"
description: "English naturale per italiani: dialoghi, storie, conversazioni e modi più naturali di dire le cose."
tagline: "Natural English for real life"
lang: "it"
locale: "it_IT"
timezone: "Europe/Rome"

url: ""
baseurl: ""

author:
  name: "Fluente-Mente"

logo: "/assets/images/logo/logo.png"

markdown: kramdown
highlighter: rouge
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - README.md
  - "*.yml.bak"

collections:
  articles:
    output: true
    permalink: /articles/:path/

defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
      author: "Fluente-Mente"
      lang: "it"
      toc: true
      comments: false
      share: true
      evergreen: true
      status: planned

editorial:
  source_of_truth: "_data/content.yml"
  content_registry: "_data/content_registry.yml"
  daily_series_name: "365 English Entry Points"
  audience: "Italian learners of English"
  primary_language: "Italian"
  example_language: "English"
  core_promise: "Natural English, not textbook English"
  total_days: 365
  articles_per_week: 7
  weeks: 53
  content_families:
    - dialogue
    - story
    - talking_about
    - alternative_ways

seo:
  site_name: "Fluente-Mente"
  default_type: "WebSite"
  article_type: "Article"
  default_meta_title_suffix: " | Fluente-Mente"
  robots: "index, follow"

pinterest:
  enabled: true
  default_board: "Learn English Naturally"
  image_ratio: "2:3"
  overlay_brand: "Fluente-Mente"

affiliate:
  enabled: true

babbel:
  enabled: true
  section_path: "/babbel/"
  program: "affiliate"
  default_destination: null
  disclosure:
    enabled: true
    text: "Alcuni link presenti su Fluente-Mente sono link affiliati. Se acquisti tramite questi link, potremmo ricevere una commissione, senza costi aggiuntivi per te."
  cta_levels: ["none", "soft", "contextual", "direct"]

navigation:
  main:
    - title: "Home"
      url: "/"
    - title: "Dialogues"
      url: "/dialogues/"
    - title: "Stories"
      url: "/stories/"
    - title: "Talking About"
      url: "/talking-about/"
    - title: "Alternative Ways"
      url: "/alternative-ways-to-say/"
    - title: "Daily"
      url: "/daily/"
    - title: "Babbel"
      url: "/babbel/"

labels:
  continue_learning: "Continua a imparare"
  read_next: "Leggi anche"
  key_expressions: "Espressioni chiave"
  takeaway: "La cosa da ricordare"
  level: "Livello"
  article: "Articolo"
  week: "Settimana"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: "/feed.xml"

sitemap:
  enabled: true

show_drafts: false
future: false
unpublished: false
safe: true
