title: "Fluente-Mente"
description: "Risorse pratiche per italiani che vogliono capire, parlare e usare l'inglese con maggiore naturalezza."
tagline: "Impara l'inglese che ti serve davvero."
lang: "it"
locale: "it_IT"
timezone: "Europe/Rome"
url: "https://nausica-20.github.io"
baseurl: "/Fluente-Mente"
repository: "nausica-20/Fluente-Mente"
author:
  name: "Fluente-Mente"
logo: "/assets/images/logo/logo.svg"
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: "/feed.xml"
sitemap:
  enabled: true
show_drafts: false
future: false
unpublished: false
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - schemas
  - README.md
  - README_SCHEMA.md
  - AUDIT_*.md
  - VALIDATION_*.txt
  - _generated
