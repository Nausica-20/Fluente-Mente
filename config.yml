# =========================================================
# FLUENTE-MENTE
# Jekyll Configuration
# =========================================================

title: "Fluente-Mente"
description: "Inglese pratico, spiegato in modo semplice."
lang: "it"

url: "https://nausica-20.github.io"
baseurl: "/FluenteMente"

author:
  name: "Fluente-Mente"

github_username: "Nausica-20"

# ---------------------------------------------------------
# Build
# ---------------------------------------------------------

markdown: kramdown
permalink: /:categories/:title/

timezone: Europe/Rome

# ---------------------------------------------------------
# Collections
# ---------------------------------------------------------

collections:
  series:
    output: true
    permalink: /serie/:name/

# ---------------------------------------------------------
# Defaults
# ---------------------------------------------------------

defaults:

  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "it"

  - scope:
      path: ""
      type: "series"
    values:
      layout: "series"
      lang: "it"

  - scope:
      path: ""
    values:
      layout: "default"
      lang: "it"

# ---------------------------------------------------------
# Plugins
# ---------------------------------------------------------

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# ---------------------------------------------------------
# Exclude
# ---------------------------------------------------------

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - prompts
  - output
