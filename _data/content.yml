schema_version: '2.0'
site:
  language: it
  market: IT
  subject: English learning
  primary_audience: Italian adults learning English
  core_levels:
  - A2
  - B1
  - B2
  editorial_principle: One content unit = one primary user job = one clear learning outcome
  content_strategy: Problem → Learning → Practice → Progression → Next step
  name: Fluente-Mente
  base_url: https://nausica-20.github.io/fluente-mente/
  repository: nausica-20/fluente-mente
  github_username: nausica-20
  github_repository: nausica-20/fluente-mente
  pinterest_url: https://pin.it/7AH50mTlA
content_types:
  QA: Answer a precise learner question
  RLG: Solve a real-life communication situation
  LES: Teach one micro-skill through practical examples
  PS: Solve a learner problem or learning blockage
  REF: Provide a reusable reference resource
  PATH: Guide progression across several content units
  DG: Help the learner choose a method, tool or next step
funnel_roles:
  D: 'Discovery: attract qualified search/Pinterest traffic'
  L: 'Learning: teach or solve a concrete language need'
  P: 'Progression: connect the learner to the next skill or resource'
  C: 'Conversion: support an informed commercial decision'
search_intents:
  informational: Understand a topic or answer a question
  learning: Learn or practise a language skill
  reference: Find a reusable list, guide or reference
  problem: Solve a specific learning or communication problem
  comparison: Compare alternatives
  commercial: Evaluate a product, method or purchase decision
pinterest_intents:
  curiosity: Trigger curiosity around a useful language insight
  problem: Solve a recognisable learner problem
  saveable: Create a resource worth saving for later
  how_to: Show how to do or say something
  list: Provide a useful list or collection
  mistake: Prevent a common mistake
  inspiration: Motivate or encourage progress
  decision: Help choose between options
commercial_intents:
  none: No meaningful commercial intent
  low: Commercial relevance is contextual only
  medium: A relevant tool or next-step CTA can be useful
  high: The user is evaluating a learning solution
  direct: The page directly supports a product/method decision
priorities:
  P0: Core launch content
  P1: Important second-wave content
  P2: Expansion content
statuses:
  idea: Not yet approved
  approved: Approved for production
  brief_ready: Learning brief complete
  drafting: Article in production
  qa: Editorial/SEO QA
  published: Live
  update_needed: Published but needs revision
  retired: No longer active
levels:
  A2: Can communicate in familiar everyday situations with support
  B1: Can handle common conversations and explain experiences/opinions
  B2: Can communicate more spontaneously, precisely and naturally
  A2-B1: Designed to support transition from A2 to B1
  B1-B2: Designed to support transition from B1 to B2
domains:
- domain_id: use_english
  name: Use English
  mission: Use English to start, maintain and manage real conversations.
  audience_job: I know some English, but I need to use it when talking to people.
  clusters:
  - cluster_id: starting_conversations
    name: Starting conversations
  - cluster_id: keeping_conversations_going
    name: Keeping conversations going
  - cluster_id: requests_and_help
    name: Requests, clarification and help
  - cluster_id: opinions_and_social
    name: Opinions, plans and social interaction
- domain_id: understand_real_english
  name: Understand Real English
  mission: Recognise the English people actually use in everyday speech and writing.
  audience_job: I know the words, but real English often sounds different from what I studied.
  clusters:
  - cluster_id: everyday_expressions
    name: Everyday expressions and reactions
  - cluster_id: spoken_english
    name: Spoken English
  - cluster_id: natural_vs_literal
    name: Natural vs literal English
  - cluster_id: false_friends
    name: False friends and Italian traps
- domain_id: build_better_english
  name: Build Better English
  mission: Build grammar, vocabulary and word combinations through real communication.
  audience_job: I want to say things correctly and naturally, not just know grammar rules.
  clusters:
  - cluster_id: grammar_in_context
    name: Grammar in context
  - cluster_id: prepositions
    name: Prepositions
  - cluster_id: italian_mistakes
    name: Common Italian mistakes
  - cluster_id: collocations
    name: Collocations and natural combinations
  - cluster_id: functional_vocabulary
    name: Vocabulary by function
- domain_id: english_for_real_life
  name: English for Real Life
  mission: Handle concrete situations at the airport, hotel, restaurant, workplace and social life.
  audience_job: I need English for something I actually have to do.
  clusters:
  - cluster_id: travel_airport
    name: Airport English
  - cluster_id: travel_hotel
    name: Hotel English
  - cluster_id: travel_restaurant
    name: Restaurant English
  - cluster_id: work_email
    name: Work emails
  - cluster_id: work_meetings
    name: Work meetings
  - cluster_id: job_interviews
    name: Job interviews
  - cluster_id: social_life
    name: Social English
  - cluster_id: everyday_problem_solving
    name: Everyday problem solving
  - cluster_id: calls_and_video
    name: Phone and video calls
- domain_id: get_unstuck
  name: Get Unstuck
  mission: Remove the specific learning barriers that stop learners from making progress.
  audience_job: I am studying, but something keeps stopping me from speaking, understanding or progressing.
  clusters:
  - cluster_id: speaking_problems
    name: Speaking problems
  - cluster_id: listening_problems
    name: Listening problems
  - cluster_id: vocabulary_problems
    name: Vocabulary and memory problems
  - cluster_id: study_habits
    name: Study habits and consistency
  - cluster_id: levels_and_progression
    name: Levels and progression
- domain_id: choose_next_step
  name: Choose Your Next Step
  mission: Help learners evaluate methods and choose tools that fit their needs.
  audience_job: I know I want to improve, but I need to decide how to learn and what to use.
  clusters:
  - cluster_id: learning_methods
    name: Learning methods
  - cluster_id: learning_apps
    name: Language-learning apps
  - cluster_id: babbel_fundamentals
    name: Babbel fundamentals
  - cluster_id: babbel_by_need
    name: Babbel by learner need
  - cluster_id: babbel_decision
    name: Babbel decision guides
