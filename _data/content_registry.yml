version: '1.1'
schema: fluente-mente-content-registry-v1.1
project: Fluente-Mente
purpose: Single operational registry for publishable Fluente-Mente content. Expression records are data entities in the Expression
  Database and do not create individual site routes.
source_of_truth: content_mapping.yml
content_flow:
- Expression Data
- Daily Pill
- Situation Article
- Situational Grammar Article
content_types:
  daily_pill: Daily micro-lesson page.
  situation_article: Long-form situational English article.
  grammar_article: Long-form situational grammar article.
  pills_index: Daily-pill index page.
  situations_index: Situational English index page.
  grammar_index: Situational Grammar index page.
  expressions_index: Searchable/filterable expression database; one site page backed by 365 expression data records.
  words_index: Word/vocabulary index page.
  confusion_article: Contrastive language article comparing easily confused items.
  travel_article: Travel-domain English article.
  business_article: Professional-domain English article.
  culture_article: Language, culture and pragmatics article.
  adult_learning_article: Adult-learning method and strategy article.
  babbel_page: Babbel informational/commercial page.
  confusions_index: Index page for the Non sono la stessa cosa! series.
status_values:
- planned
- brief_ready
- drafting
- draft_ready
- review
- approved
- published
- needs_update
- archived
routes:
  pill_prefix: /pills/
  situation_prefix: /situations/
  grammar_prefix: /grammar/
  expression_prefix: /expressions/
  words_prefix: /words/
  confusion_prefix: /non-sono-la-stessa-cosa/
  travel_prefix: /travel-english/
  business_prefix: /business-english/
  culture_prefix: /english-culture/
  adult_learning_prefix: /inglese-da-adulti/
  babbel_prefix: /babbel/
rules:
  one_registry_record_per_publishable_route: true
  unique_ids: true
  unique_slugs: true
  one_expression_per_pill: true
  one_primary_situation_per_pill: true
  one_primary_grammar_per_pill: true
  one_situation_article_per_situation: true
  one_grammar_article_per_grammar_unit: true
  jekyll_ready_routes: true
  status_defaults_to_planned: true
  expression_is_data_only: true
  no_expression_detail_pages: true
  one_confusion_article_per_group: true
  one_domain_article_per_intent: true
  one_babbel_page_per_intent: true
  hub_root_owned_by_hub_article: true
totals:
  expressions: 365
  daily_pills: 365
  situations: 52
  situational_grammar: 52
  situation_articles: 52
  grammar_articles: 52
  index_pages: 6
  registry_records: 841
  confusion_articles: 259
  travel_articles: 26
  business_articles: 26
  culture_articles: 24
  adult_learning_articles: 24
  babbel_pages: 7
qa:
  unique_ids: true
  unique_publishable_slugs: true
  365_expressions: true
  365_daily_pills: true
  52_situation_articles: true
  52_grammar_articles: true
  5_index_pages: true
  all_pills_have_expression: true
  all_pills_have_situation: true
  all_pills_have_grammar: true
  duplicate_ids: []
  duplicate_slugs: []
  365_expression_data_entities: true
  no_expression_detail_routes: true
  registry_records_exclude_expression_data: true
  259_confusion_articles: true
  26_travel_articles: true
  26_business_articles: true
  24_culture_articles: true
  24_adult_learning_articles: true
  7_babbel_pages: true
  6_index_pages: true
  841_registry_records: true
