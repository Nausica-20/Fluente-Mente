schema_version: '1.0'
project: fluente-mente
purpose: Annual macro-theme taxonomy linking the 52 weekly themes to the seven editorial rubrics.
rules:
  total_macro_themes: 52
  one_macro_theme_per_week: true
  articles_per_theme: 7
  annual_editorial_articles: 364
  one_article_per_rubric_per_theme: true
  theme_is_a_topic_not_a_rubric: true
  babbel_is_separate: true
  avoid_sequential_day_naming_in_public_urls: true
