launch_checklist:
- Inserire il network affiliate effettivamente utilizzato.
- Inserire publisher ID e URL affiliato ufficiali.
- Verificare commissioni, cookie window e termini attuali del programma.
- Testare ogni link affiliato in ambiente reale.
- Verificare disclosure e privacy/cookie requirements applicabili.
- Definire il formato definitivo dei parametri di tracking.
- Verificare che i report del network permettano di attribuire almeno content_id e cta_id.
- Non pubblicare claim su prezzi, sconti, offerte o commissioni finché non sono verificati.
