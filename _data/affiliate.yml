tracking:
  enabled: true
  method: subid_or_network_tracking_parameter
  content_parameter: content_id
  cluster_parameter: cluster
  topic_parameter: topic_id
  cta_parameter: cta_id
  pin_parameter: pin_id
  path_parameter: path_id
  utm:
    source: pinterest
    medium: social
    campaign: babbel_affiliate
    content: dynamic
  rules:
    one_stable_content_id_per_article: true
    do_not_insert_personal_data: true
    keep_tracking_parameters_consistent: true
    document_parameter_naming: true
disclosure:
  required: true
  short_label: Link affiliato
  short_text: Questo contenuto può contenere link affiliati.
  standard_text: Alcuni link presenti sul sito sono link affiliati. Se acquisti tramite uno di questi link, potremmo ricevere
    una commissione senza costi aggiuntivi per te.
  placement:
  - near_first_affiliate_link_when_appropriate
  - affiliate_content_header_or_intro
  - site_footer
  do_not:
  - hide_the_affiliate_nature_of_the_link
  - claim_neutrality_when_content_is_commercial
  - imply_endorsement_not_supported_by_current_terms
  site_specific_note: Affiliate link provided by the site owner; current commercial terms, commission and cookie window still
    require verification from Awin/Babbel documentation before publication.
commercial_content_policy:
  principles:
    education_before_conversion: true
    user_fit_before_sale: true
    honest_pros_and_cons: true
    no_fake_urgency: true
    no_unverified_discount_claims: true
    no_guaranteed_results: true
    no_negative_competitor_claims_without_evidence: true
  content_roles:
    informational:
      affiliate_link: optional
      primary_goal: help_user
      recommended_cta: soft_or_learning
    learning:
      affiliate_link: contextual
      primary_goal: progress
      recommended_cta: learning_first
    comparison:
      affiliate_link: allowed
      primary_goal: decision_support
      recommended_cta: decision
    commercial:
      affiliate_link: primary
      primary_goal: qualified_conversion
      recommended_cta: commercial
placement:
  rules:
    do_not_place_babbel_cta_on_every_page: true
    match_cta_to_intent: true
    keep_affiliate_ctas_contextual: true
    avoid_interstitial_pressure: true
    provide_non_affiliate_learning_links: true
  recommended_locations:
  - after_problem_solution_section
  - after_method_comparison_section
  - end_of_commercial_article
  - learning_path_next_step_module
  avoid_locations:
  - before_the_user_receives_any_value
  - inside_unrelated_definitions
  - repeated_immediately_in_multiple_blocks
affiliate_cta_policy:
  default_primary_cta: CTA-007
  decision_cta: CTA-009
  comparison_cta: CTA-011
  soft_next_step_cta: CTA-008
  direct_offer_cta: CTA-010
  max_affiliate_ctas_per_standard_article: 2
  max_affiliate_ctas_per_commercial_article: 3
