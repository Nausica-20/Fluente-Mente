  audit_version: '1.1'
  status: corrected_after_registry_completion
  resolved_issues:
  - Explicit authority model between Master, component architectures, mapping, source data and registry.
  - Separated dedicated indexes from editorial hub roots.
  - Clarified that TRV026, BUS026, CUL024, ADU024 and BAB001 own their section root routes.
  - Separated Pill ID from day number.
  - 'Corrected registry state: 474 currently registered, 835 publishable planned.'
  - Added planned-but-unregistered Confusion index.
  - Explicitly marked Words source as pending instead of treating a nonexistent data source as authoritative.
  - Added a contract preventing invented vertical mappings.
  - Registered the remaining 367 planned publishable records; registry now contains 841 routes including 6 dedicated index
    pages.
  validated_totals:
    publishable_content: 835
    dedicated_indexes: 6
    planned_routes_total: 841
    registered_registry_records_currently: 841
    registered_registry_records: 841
    registered_registry_records_before_completion: 474
