writing_resolution_algorithm:
  purpose: Permettere al prompt di scrittura di risolvere automaticamente quale Master Architecture e quali record usare.
  steps:
  - 1. Identify the requested content_type or series.
  - 2. Resolve the canonical component architecture.
  - 3. Resolve the content ID and preserve it exactly.
  - 4. Resolve the canonical slug and permalink from the source record.
  - 5. Load the required mapped records from content_mapping.yml when the content is part of the core engine.
  - 6. Apply the component-specific article structure and learning design.
  - 7. Apply global anti-duplication rules before drafting.
  - 8. Add internal links only from explicit mappings or clear semantic relevance.
  - 9. Add the configured Babbel CTA only in the permitted commercial layer/position.
  - 10. Validate front matter, canonical URL, IDs, level and required sections before publication.
prompt_input_priority:
  priority_1: master_content_architecture.yml
  priority_2: relevant component master architecture
  priority_3: _data/content_mapping.yml for mapped core relationships
  priority_4: relevant source data record
  priority_5: _data/content_registry.yml for current publication/registration state
  priority_6: editorial inference only when no authoritative mapping exists
  hard_rules:
  - Never invent an ID.
  - Never invent a canonical permalink.
  - Never override an approved route with a new route.
  - Never create an expression detail page.
  - Never create an additional index when a hub already owns the root route.
writing_system:
  global_article_requirements:
  - Write for Italian learners.
  - Use natural English rather than literal Italian translation.
  - Stay within the assigned CEFR level.
  - Respect the content owner's mission.
  - Use the source record as the factual/content constraint.
  - Keep one primary intent.
  - Use internal links only when they add learning/navigation value.
  - Do not create duplicate routes.
  - Do not introduce audio or pronunciation sections.
  content_specific_rules:
    daily_pill: Exactly one primary expression; canonical learning page.
    situation: One whole communicative scenario with dialogue, useful language, Italian traps and practice.
    grammar: One primary grammar point taught through the mapped situation.
    confusion: One confusion group with contrast, examples, dialogue, memory tip and challenge.
    travel: Travel-domain article; may reuse core language but cannot become a duplicate Situation.
    business: Professional-domain article; may reuse core language but cannot become a duplicate workplace Situation.
    culture: Culture/pragmatics article; must produce a concrete language-learning outcome.
    adult_learning: Learning-strategy article; must end in a practical action.
    babbel: Informational/commercial page; no unverified offer, price, discount or result claim.
quality_gates:
  architecture:
  - Content type is correctly classified.
  - Correct component architecture is used.
  - ID is unique and preserved.
  - Slug and permalink are canonical.
  - Primary intent is distinct.
  editorial:
  - Natural English.
  - Context before rules.
  - Italian learner relevance.
  - CEFR integrity.
  - No unnecessary lexical or grammar duplication.
  linking:
  - Core mappings are respected.
  - Cross-links are relevant.
  - No links to non-existent expression detail pages.
  - Vertical cross-links do not collapse separate missions.
  commercial:
  - Babbel CTA only where configured.
  - Disclosure where required.
  - No unverified commercial claims.
  technical:
  - No duplicate permalink.
  - No duplicate canonical intent.
  - Front matter conforms to component contract.
  - Status matches content registry workflow.
production_order:
  phase_0: Freeze architecture, mapping, routes and writing contracts.
  phase_1: Audit cross-layer relationships and duplicate intents.
  phase_2: Build/validate article templates.
  phase_3: Write one reference article per content type.
  phase_4: QA reference articles and update prompts if needed.
  phase_5: Produce controlled batches.
  phase_6: Publish, link, distribute and analyze.
final_principle: 'Fluente-Mente non è una collezione di rubriche indipendenti: è un ecosistema in cui ogni contenuto ha un
  proprietario, un intento, un URL canonico e un ruolo preciso nella rete di apprendimento.'
authority_model:
  master_content_architecture:
    owns:
    - global ontology
    - project hierarchy
    - content ownership
    - canonical route policies
    - global anti-duplication rules
    - global writing rules
    does_not_own: individual content facts or detailed rubric/article specifications
  component_master_architecture:
    owns:
    - rubric mission
    - article intent
    - article format
    - component-specific learning design
    - component-specific editorial rules
    priority_over: global defaults when the component requires a more specific rule
  content_mapping:
    owns:
    - expression -> daily pill
    - daily pill -> primary situation
    - daily pill -> primary grammar
    - situation -> grammar
    - operational cross-links among core learning entities
    priority_over: semantic guessing for mapped relationships
  source_data:
    owns:
    - individual expression records
    - individual pill records
    - individual situation records
    - individual grammar records
    - individual confusion records
  content_registry:
    owns:
    - registered publishable routes
    - publication status
    - registry identity for publishable routes
    note: The registry is operational and may lag the full planned architecture until planned components are registered.
hub_and_index_model:
  principle: A section root may be either a dedicated index page or the canonical hub article of that section. Never create
    both for the same route.
  dedicated_index_pages:
  - /pills/
  - /situations/
  - /grammar/
  - /expressions/
  - /words/
  - /non-sono-la-stessa-cosa/
  editorial_hub_roots:
    travel_english:
      route: /travel-english/
      owner_content_id: TRV026
      is_separate_index_page: false
    business_english:
      route: /business-english/
      owner_content_id: BUS026
      is_separate_index_page: false
    english_culture:
      route: /english-culture/
      owner_content_id: CUL024
      is_separate_index_page: false
    inglese_da_adulti:
      route: /inglese-da-adulti/
      owner_content_id: ADU024
      is_separate_index_page: false
    babbel:
      route: /babbel/
      owner_content_id: BAB001
      is_separate_index_page: false
  rule: The five editorial roots above are already counted inside the 835 planned publishable contents through their hub records;
    they must not be counted again as index pages.
content_identity_rules:
  daily_pill:
    primary_id_field: pill_id
    id_pattern: PILL001-PILL365
    required_identity_fields:
    - pill_id
    - day
    - expression_id
    - article_slug
    - permalink
    day_role: publication/order attribute, not the canonical content identifier
    canonical_url: /pills/{article_slug}/
  situation:
    primary_id_field: situation_id
    id_pattern: SIT001-SIT052
  grammar:
    primary_id_field: grammar_id
    id_pattern: GRAM001-GRAM052
  confusion:
    primary_id_field: content_id
    id_pattern: conf-001-conf-259
  verticals:
    travel: TRV001-TRV026
    business: BUS001-BUS026
    culture: CUL001-CUL024
    adult_learning: ADU001-ADU024
  babbel: BAB001-BAB007
  immutability: IDs and canonical permalinks must not be changed after architecture approval.
language_data_model:
  expressions:
    status: defined
    source: _data/expressions_001-365_clean.yml
    records: 365
    individual_detail_pages: false
    index_route: /expressions/
    canonical_educational_destination: daily_pill
  words:
    status: pending_source_definition
    source: null
    index_route: /words/
    individual_detail_pages: not defined
    current_usage: The Words index exists architecturally, but a dedicated authoritative words data source is not yet defined
      in this Master Content Architecture.
    temporary_rule: Do not invent a new words database or individual word routes during article generation.
    next_definition_required:
    - word schema
    - source file
    - record count
    - ownership
    - deduplication rules
    - mapping to articles
vertical_mapping_contract:
  purpose: Prevent the writing prompt from inventing cross-links among the four vertical layers.
  mapping_status: planned_contract
  travel_english:
    source: null
    fallback: semantic relevance may be used only when no explicit mapping exists, without inventing IDs.
  business_english:
    source: null
    fallback: semantic relevance may be used only when no explicit mapping exists, without inventing IDs.
  english_culture:
    source: null
    fallback: semantic relevance may be used only when no explicit mapping exists, without inventing IDs.
  inglese_da_adulti:
    source: null
    fallback: semantic relevance may be used only when no explicit mapping exists, without inventing IDs.
  hard_rule: An article may link to a vertical only when an explicit mapping exists or the relevance is evident from the article
    itself; never fabricate an ID, slug or URL.
