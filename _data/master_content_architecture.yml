  confusions_index: /non-sono-la-stessa-cosa/
  confusions: /non-sono-la-stessa-cosa/{slug}/
  travel_hub: /travel-english/
  travel_articles: /travel-english/{slug}/
  business_hub: /business-english/
  business_articles: /business-english/{slug}/
  culture_hub: /english-culture/
  culture_articles: /english-culture/{slug}/
  adult_hub: /inglese-da-adulti/
  adult_articles: /inglese-da-adulti/{slug}/
  babbel_hub: /babbel/
