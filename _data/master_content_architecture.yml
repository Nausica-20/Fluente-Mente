schema_version: '1.0'
project: Fluente-Mente
architecture_type: master_content_architecture
architecture_status: coordinating_source_of_truth
purpose: Coordinare tutte le Master Architecture del progetto e definire identità, gerarchia, proprietà del contenuto, relazioni,
  rotte canoniche e regole anti-duplicazione.
content_model_principle: Il sistema massimizza le connessioni utili tra contenuti, non il numero di URL.
source_of_truth:
  this_file: Master Content Architecture
  operational_mapping: _data/content_mapping.yml
  publishable_registry: _data/content_registry.yml
  component_architectures:
    daily_pill: pillola_del_giorno_master_architecture.yml
    situations: situational_master_architecture.yml
    situational_grammar: grammar_situations_master_architecture.yml
    confusions: non_sono_la_stessa_cosa_master_architecture.yml
    travel: travel_english_master_architecture.yml
    business: business_english_master_architecture.yml
    culture: english_culture_master_architecture.yml
    adult_learning: inglese_da_adulti_master_architecture.yml
    babbel: babbel_master_architecture.yml
project_hierarchy:
  level_1_core_learning_engine:
    mission: Insegnare inglese naturale attraverso micro-lezioni, situazioni e grammatica contestuale.
    components:
    - daily_pills
    - situations
    - situational_grammar
  level_2_contrastive_layer:
    mission: Risolvere confusioni linguistiche che ostacolano la scelta della forma corretta.
    components:
    - non_sono_la_stessa_cosa
  level_3_domain_layers:
    mission: Organizzare l'inglese attorno a bisogni e domini più ampi.
    components:
    - travel_english
    - business_english
    - english_culture
    - inglese_da_adulti
  level_4_language_data:
    mission: Conservare e rendere navigabili le entità linguistiche senza duplicare gli articoli.
    components:
    - expressions_data
    - words_index
  level_5_commercial_layer:
    mission: Presentare Babbel come possibile soluzione strutturata per continuare l'apprendimento.
    components:
    - babbel
global_editorial_rules:
  natural_english_first: true
  context_before_rule: true
  one_primary_intent_per_publishable_article: true
  one_primary_cefr_level_per_publishable_article: true
  one_canonical_url_per_publishable_article: true
  no_duplicate_learning_page_for_same_primary_intent: true
  expression_records_are_data_only: true
  no_expression_detail_pages: true
  no_audio: true
  no_pronunciation_section: true
  italian_learner_focus: true
  supporting_language_does_not_automatically_create_new_content: true
  exposure_language_does_not_automatically_create_new_content: true
  babbel_is_not_an_editorial_rubric: true
  all_cross_links_must_be_relevant: true
  source_ids_and_permalinks_are_immutable_once_approved: true
content_ownership:
  expression:
    owner: expression_database
    role: data_entity
    canonical_educational_page: daily_pill
    route: /expressions/
    no_detail_route: true
  daily_pill:
    owner: pillola_del_giorno
    role: one-expression micro-lesson
    canonical_route: /pills/{article_slug}/
  situation:
    owner: situazioni
    role: whole communicative scenario
    canonical_route: /situations/{situation_slug}/
  grammar:
    owner: grammar_situations
    role: one primary grammar point taught through context
    canonical_route: /grammar/{grammar_slug}/
  confusion:
    owner: non_sono_la_stessa_cosa
    role: contrastive language lesson
    canonical_route: /non-sono-la-stessa-cosa/{slug}/
  travel:
    owner: travel_english
    role: travel-domain content
    canonical_route: /travel-english/{slug}/
  business:
    owner: business_english
    role: professional-domain content
    canonical_route: /business-english/{slug}/
  culture:
    owner: english_culture
    role: culture/pragmatics/context content
    canonical_route: /english-culture/{slug}/
  adult_learning:
    owner: inglese_da_adulti
    role: learning-method and adult-learning content
    canonical_route: /inglese-da-adulti/{slug}/
  babbel:
    owner: babbel
    role: commercial/informational content
    canonical_route: /babbel/{slug}/
relationship_model:
  canonical_learning_chain:
  - expression_record
  - daily_pill
  - situation
  - situational_grammar
  transversal_layer: non_sono_la_stessa_cosa
  domain_expansion:
  - travel_english
  - business_english
  - english_culture
  - inglese_da_adulti
  commercial_destination: babbel
  rule: 'Non tutti i contenuti devono collegarsi a tutti gli altri: il collegamento si crea solo quando migliora apprendimento,
    navigazione o intento.'
relationship_rules:
  expression_to_pill: Each expression has exactly one primary Daily Pill.
  pill_to_situation: Each Daily Pill has one primary Situation when mapped.
  pill_to_grammar: Each Daily Pill has one primary Grammar Situation when mapped.
  situation_to_grammar: Each core Situation has one primary Grammar article.
  situation_to_pills: Situation articles reuse all mapped Pill days; they do not create duplicate Pills.
  grammar_to_situation: Grammar article links to its primary Situation.
  grammar_to_pills: Grammar article links to mapped Pill days when relevant.
  confusion_to_pill: Link to a Pill only when a target item belongs to the central expression corpus.
  confusion_to_situation: Link to a Situation when the distinction is clarified by a complete real-life scenario.
  confusion_to_grammar: Link to Grammar when the confusion is structurally grammatical.
  vertical_to_core: Travel/Business/Culture/Adult articles can reuse core content but must retain their own domain mission.
  core_to_vertical: Core articles link to vertical articles only when the domain context is genuinely useful.
  culture_crosslink: Use Culture for pragmatic/social/cultural interpretation, not to duplicate a language lesson.
  adult_crosslink: Use Adult Learning for how-to-learn questions, not to duplicate the teaching content.
  babbel_crosslink: Babbel is a secondary commercial destination; it must not replace the editorial content.
anti_duplication_matrix:
  daily_pill_vs_situation: Pill = one expression; Situation = whole interaction.
  daily_pill_vs_grammar: Pill = expression/use; Grammar = structural point/function.
  daily_pill_vs_confusion: Pill = one central expression; Confusion = compare two or more easily confused items.
  situation_vs_grammar: Situation = communication scenario; Grammar = one structure inside that scenario.
  situation_vs_travel: Situation = specific communicative moment; Travel = broader travel domain.
  situation_vs_business: Situation = specific interaction; Business = broader professional domain.
  situation_vs_culture: Situation = what to say/do; Culture = why context/pragmatics may differ.
  grammar_vs_confusion: Grammar = structural system; Confusion = choice between competing forms.
  travel_vs_business: Travel owns travel domain; Business owns professional domain.
  culture_vs_business: Culture may explain communication expectations; Business owns workplace communication content.
  adult_vs_all: Adult Learning owns learning strategy, not English-language subject matter.
  babbel_vs_all: Babbel owns product/informational/commercial intent, not general English teaching.
  expression_database_vs_all: Database is data/navigation; it is not a duplicate article layer.
