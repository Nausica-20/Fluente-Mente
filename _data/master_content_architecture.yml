  index:
  - /pills/
  - /situations/
  - /grammar/
  - /expressions/
  - /words/
  - /non-sono-la-stessa-cosa/
  hub_article:
  - /travel-english/
  - /business-english/
  - /english-culture/
  - /inglese-da-adulti/
  - /babbel/
  cluster_article:
  - /travel-english/{slug}/
  - /business-english/{slug}/
  - /english-culture/{slug}/
  - /inglese-da-adulti/{slug}/
  - /babbel/{slug}/
  rule: A hub article is a publishable content record and also acts as the section root. It is not a second index record.
