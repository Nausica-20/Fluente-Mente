schema_version: '1.1'
purpose: Canonical didactic topic taxonomy linking editorial content to communicative skills and learner progression.
rules:
  one_primary_topic_per_content: true
  topic_is_not_a_keyword: true
  topic_represents_a_learning_need_or_skill: true
  same_topic_can_contain_multiple_content_units: true
  content_must_have_a_distinct_learning_outcome: true
  levels_are_guidance_not_prerequisites: true
levels:
  A2: Can handle familiar everyday communication with simple language.
  B1: Can manage common situations, explain ideas and maintain conversations with increasing independence.
  B2: Can interact more spontaneously, precisely and flexibly across familiar and professional situations.
  B2+: Can refine naturalness, nuance, interaction and control beyond core B2.
