schema_version: '1.2'
purpose: Canonical learning-path layer connecting topics and content units into purposeful learner journeys.
rules:
  paths_are_sequences_not_categories: true
  each_path_has_one_primary_outcome: true
  steps_should_progress_in_difficulty: true
  a_content_unit_can_belong_to_multiple_paths: true
  commercial_steps_should_appear_only_when_relevant: true
  babbel_is_a_next_step_not_a_requirement: true
path_types:
  level_progression: Percorso progressivo basato sul livello.
  skill: Percorso centrato su una competenza specifica.
  situation: Percorso centrato su una situazione della vita reale.
  problem_solution: Percorso costruito attorno a un problema dell'apprendente.
  decision: Percorso che aiuta a scegliere metodo o strumento.
