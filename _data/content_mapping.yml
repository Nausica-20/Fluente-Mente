version: '1.1'
project: Fluente-Mente
description: Definitive editorial content mapping for the Fluente-Mente learning system. Expression records are
  data entities; /expressions/ is one navigable database page, while /pills/ contains the canonical editorial lessons.
editorial_model:
  daily_layer: 365 Daily Pills
  expression_layer: 365 Expressions as data records (non-publishable individually)
  situation_layer: 52 Situational Hubs
  grammar_layer: 52 Situational Grammar Units
  long_form_article_layer: 52 Situation Articles + 52 Grammar Articles
  supporting_page_layer: 365 Pill Pages + 1 Expression Database + 1 Word index
content_flow:
- Expression Data
- Daily Pill
- Situation
- Situational Grammar
- Long-form Article
rules:
  one_expression_per_pill: true
  one_primary_situation_per_pill: true
  one_primary_grammar_per_pill: true
  one_primary_article_per_situation: true
  one_primary_article_per_grammar_unit: true
  article_slugs_are_jekyll_ready: true
  expression_records_are_data_only: true
  no_expression_detail_pages: true
totals:
  expressions: 365
  daily_pills: 365
  situations: 52
  situational_grammar: 52
  situation_articles: 52
  grammar_articles: 52
  pill_pages: 365
routes:
  pill_prefix: /pills/
  situation_prefix: /situations/
  grammar_prefix: /grammar/
  expression_prefix: /expressions/
  words_prefix: /words/
