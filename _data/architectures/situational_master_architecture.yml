schema_version: '1.0'
project: Fluente-Mente
architecture_type: master_editorial_architecture
content_type: situation_article
source_of_truth:
  situation_architecture: _data/situational.yml
  content_mapping: _data/content_mapping.yml
  expression_database: _data/expressions_001-365_clean.yml
  grammar_database: _data/situational_grammar.yml
  content_registry: _data/content_registry.yml
  front_matter_contract: situational_articles_front_matter.yml
series:
  id: situational_english
  name_it: Situazioni
  name_en: Situational English
  purpose: Insegnare l'inglese naturale attraverso 52 situazioni comunicative concrete e ricorrenti.
  total_situations: 52
  total_publishable_articles: 52
  canonical_model: one_situation -> one_situation_article
mission:
  primary_promise: Impara cosa dire, come dirlo e come reagire in una situazione reale.
  learner_profile: Italian-speaking learners from A2 to B2 who want practical, natural English.
  editorial_language: Italian
  target_language: Natural English
  learning_style:
  - context-first
  - situational
  - natural-not-textbook
  - practical
  - dialogue-led
  - guided-practice
  core_question: Cosa direi davvero in questa situazione?
core_rules:
  one_situation_one_article: true
  one_primary_situation_per_article: true
  one_primary_communicative_mission_per_article: true
  situation_is_broader_than_one_expression: true
  dialogue_is_required: true
  natural_english_over_textbook_english: true
  context_before_rule: true
  italian_transfer_errors_are_explicit: true
  situational_grammar_only: true
  no_audio: true
  no_pronunciation_section: true
  no_standalone_vocabulary_page_generated: true
  no_parallel_situational_grammar_library: true
  mapped_pills_are_reused_not_duplicated: true
  babbel_is_secondary_cta: true
url_architecture:
  index_url: /situations/
  article_url_pattern: /situations/{situation_slug}/
  permalink_rule: stable, lowercase, hyphenated, descriptive and unique
  canonical_rule: each situation article self-canonicalizes to its own permalink
  article_slug_rule: situations/{source_situation_slug}
standard_front_matter:
  defaults:
    layout: article
    content_type: situation_article
    published: false
    language: it
    cta_profile: solution_soft
    babbel_cta_enabled: true
  required_jekyll_fields:
  - layout
  - title
  - description
  - slug
  - permalink
  - published
  - language
  - level
  required_situation_fields:
  - situation.id
  - situation.slug
  - situation.title
  - situation.title_it
  - domain
  - communicative_goals
  required_learning_fields:
  - target_language.expression_ids
  - target_language.pill_days
  - target_language.grammar_id
  - target_language.grammar_slug
  - target_language.grammar_point
  - target_language.core_patterns
  - target_language.natural_examples
  - learning_design
  required_linking_fields:
  - related_content.daily_pill_days
  - related_content.expression_ids
  - related_content.grammar_article_url
  - related_content.related_situation_ids
  required_seo_fields:
  - seo.primary_keyword
  - seo.secondary_keywords
  - seo.meta_title
  - seo.meta_description
  - seo.excerpt
  - seo.canonical
  required_commercial_fields:
  - cta_profile
  - funnel_stage
  - babbel_cta.enabled
  - babbel_cta.position
  - babbel_cta.disclosure_required
learning_design:
  method: Natural English through a real communicative situation
  focus:
  - understanding what to say
  - sounding natural rather than textbook-like
  - using useful expressions in context
  - avoiding common Italian transfer mistakes
  - building confidence through guided practice
  dialogue:
    required: true
    recommended_turns: 8
    maximum_turns: 12
    natural_language: true
  translation:
    required: true
    italian_explanation: true
  useful_language:
    required: true
    recommended_items: 8
  textbook_vs_natural:
    required: true
    examples: 4
  italian_traps:
    required: true
    minimum_items: 3
  situational_grammar:
    required: true
    grammar_article_url: /None/
    core_patterns:
    - Where do you live?
    - What do you do?
    - How long have you been here?
  mini_practice:
    required: true
    exercises: 3
  no_audio: true
  no_pronunciation_section: true
article_spec:
  required_sections:
  - title
  - intro
  - situation_context
  - dialogue
  - translation
  - useful_language
  - textbook_vs_natural
  - italian_traps
  - situational_grammar
  - mini_practice
  - related_daily_pills
  - related_articles
  - babbel_cta
  dialogue_turns: 8-12
  vocabulary_or_useful_language_items: 8
  textbook_vs_natural_examples: 4
  italian_traps_minimum: 3
  practice_exercises: 3
  related_daily_pills: use all mapped pill days
  related_situation_articles: 2-4 relevant links
  related_grammar_article: true
required_sections:
- title
- intro
- situation_context
- dialogue
- translation
- useful_language
- textbook_vs_natural
- italian_traps
- situational_grammar
- mini_practice
- related_daily_pills
- related_articles
- babbel_cta
content_targets:
  dialogue_turns: 8-12
  useful_language_items: 8
  textbook_vs_natural_examples: 4
  italian_traps_minimum: 3
  practice_exercises: 3
  related_daily_pills: use all mapped pill days
  related_situation_articles: 2-4 relevant links
  related_grammar_article: true
language_model:
  core_language:
    purpose: Language explicitly taught because it is central to the situation.
    rule: Select only language that materially supports the communicative goal.
  supporting_language:
    purpose: Useful phrases, words and patterns needed to complete the situation.
    rule: Supporting items serve the scenario; they do not automatically become new database entities or Pills.
  exposure_language:
    purpose: Authentic contextual language that makes the dialogue realistic.
    rule: Exposure language may appear naturally without becoming another teaching focus.
  expression_rule: Use mapped expression IDs from content_mapping.yml as the controlled source of truth.
  grammar_rule: Use the mapped GRAM record and teach it through the situation, not as an abstract grammar lesson.
dialogue_design:
  required: true
  turns: 8-12
  natural_language: true
  roles: Define 2 or more realistic roles appropriate to the situation.
  progression:
  - set the context
  - start the interaction
  - develop the communicative problem or need
  - respond naturally
  - reach a plausible resolution
  quality_rules:
  - No dialogue line should exist only to insert vocabulary.
  - Use natural contractions and everyday phrasing where appropriate.
  - Keep the dialogue consistent with the assigned CEFR level.
  - Do not make every line a teaching example.
textbook_vs_natural:
  required: true
  examples: 4
  purpose: Show meaningful differences between literal/school-style English and natural English used in the given situation.
  rules:
  - Only include contrasts that are genuinely useful.
  - Do not label a grammatically correct sentence as wrong merely because another version is more conversational.
  - Explain register and context.
  - Prefer natural alternatives used by real speakers.
italian_traps:
  required: true
  minimum_items: 3
  focus:
  - literal translation from Italian
  - false friends
  - wrong prepositions
  - incorrect collocations
  - over-formality
  - directness/politeness mismatch
  - word-choice interference
situational_grammar:
  required: true
  purpose: Explain the mapped grammar point only as needed to perform the communicative task.
  rules:
  - Start from the dialogue/context.
  - Show the pattern.
  - Explain the meaning/function.
  - Give natural examples from the same situation.
  - Avoid turning the section into a complete standalone grammar chapter.
mini_practice:
  required: true
  exercises: 3
  recommended_formats:
  - choose the natural response
  - complete a short exchange
  - rewrite a textbook-style phrase naturally
  - produce a short personalized response
  rule: Practice must rehearse the target situation, not introduce a new topic.
relationship_architecture:
  pillole_del_giorno:
    role: Micro-learning units that feed into the situation.
    rule: Reuse mapped Pillole; never create duplicates just because an expression appears in a Situation article.
    link_field: related_content.daily_pill_days
  expression_database:
    role: Language data layer.
    rule: Expressions remain data entities; the Situation article does not create expression detail pages.
    link_field: related_content.expression_ids
  situational_grammar:
    role: Dedicated grammar companion for the situation.
    rule: One mapped grammar unit is preferred; additional grammar may be mentioned only when necessary and must not compete
      with the primary grammar focus.
    link_field: related_content.grammar_article_url
  non_sono_la_stessa_cosa:
    role: Contrastive support when a word/expression distinction directly helps the situation.
    rule: Use only relevant comparison articles.
  travel_english:
    role: Domain-specific expansion for travel-related situations.
    rule: Situation teaches the moment; Travel English teaches the broader travel domain.
  business_english:
    role: Domain-specific expansion for workplace-related situations.
    rule: Situation teaches the moment; Business English teaches the broader professional domain.
  english_culture:
    role: Pragmatic/cultural expansion when cultural context changes interpretation.
    rule: Do not duplicate the situation; explain the cultural dimension only.
  inglese_da_adulti:
    role: Learning-strategy support.
    rule: Link only when the article genuinely benefits from a learning-method connection.
anti_overlap_rules:
  daily_pills: Pill = one expression micro-lesson; Situation = a broader communicative scenario using multiple mapped language
    units.
  grammar: Grammar article = one grammar point taught through context; Situation = broader communicative scenario.
  travel: Travel = whole travel domain; Situation = specific moment within or outside travel.
  business: Business = professional domain; Situation = specific workplace interaction.
  culture: Culture = why context/pragmatics matter; Situation = what to say and do in the interaction.
  confusion: Confusion = compare similar words/expressions; Situation = use the language in a realistic scenario.
seo_rules:
  one_primary_intent: true
  primary_keyword_rule: Use the actual communicative need expressed in Italian, not a generic 'inglese' keyword.
  secondary_keywords: Support the same intent; do not create competing search intents.
  meta_title: Clear situation + useful English intent.
  meta_description: Explain the practical outcome and major article components.
  canonical: Self-canonical.
  indexing: Publishable and indexable unless explicit QA or site policy says otherwise.
pinterest_rules:
  role: Drive qualified traffic to the canonical situation article.
  recommended_angles:
  - English for a real-life situation
  - Natural English dialogue
  - Common Italian mistakes
  - Textbook vs natural English
  - Useful English phrases for the situation
  destination: Canonical situation article, not an expression detail page.
babbel_cta:
  role: Secondary commercial layer.
  position: end_of_article
  profile: solution_soft
  disclosure_required: true
  rules:
  - No unverified pricing.
  - No unverified discounts or offers.
  - No guaranteed outcomes.
  - Do not interrupt the teaching flow.
  - Verify current commercial details before publication.
writing_prompt_contract:
  input_required:
  - one SIT record
  - mapped EXP records
  - mapped Daily Pill records/days
  - one mapped GRAM record
  - related situation IDs
  - site SEO rules
  - Babbel CTA configuration
  writer_must:
  - preserve SIT ID, title, title_it, level, domain and source slug
  - use the exact permalink generated from the source slug
  - write the article around the primary communicative situation
  - build a realistic dialogue
  - teach natural English in context
  - use mapped expressions as source-of-truth language
  - explain relevant Italian transfer traps
  - include the mapped situational grammar
  - include practical exercises
  - include internal links only when relevant
  - finish with the configured soft Babbel CTA and disclosure
  writer_must_not:
  - change the source situation identity
  - create a duplicate situation article
  - invent a second primary communicative mission
  - turn the article into a generic vocabulary list
  - turn the article into a standalone grammar chapter
  - create expression detail pages
  - add audio/pronunciation sections
  - force Travel/Business/Culture links that are not relevant
  - invent Babbel commercial claims
quality_assurance:
  pre_publish_checks:
  - Exactly one primary situation is present.
  - The source SIT ID and slug are preserved.
  - Permalink matches /situations/{slug}/.
  - Level and domain match the source architecture.
  - Communicative goals are visibly reflected in the article.
  - Dialogue is realistic and 8-12 turns.
  - Translation is natural Italian.
  - Useful Language has 8 items.
  - Textbook vs Natural has 4 meaningful contrasts.
  - At least 3 Italian traps are included.
  - Situational grammar matches the mapped GRAM record.
  - Three practice exercises rehearse the same situation.
  - All mapped Daily Pill days are linked.
  - 2-4 relevant related situation articles are linked.
  - SEO metadata is complete.
  - Babbel CTA/disclosure follows configuration.
  - No duplicate route is created.
  - No audio/pronunciation section is introduced.
  status_flow:
  - planned
  - brief_ready
  - drafting
  - draft_ready
  - review
  - approved
  - published
  - needs_update
  - archived
