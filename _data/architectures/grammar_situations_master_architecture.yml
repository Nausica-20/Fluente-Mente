schema_version: '1.0'
project: Fluente-Mente
architecture_type: master_editorial_architecture
content_type: grammar_article
series:
  id: situational_grammar
  name_it: Grammatica situazionale
  name_en: Situational Grammar
  purpose: Insegnare un punto grammaticale principale attraverso una situazione comunicativa concreta, con esempi naturali,
    errori tipici italiani e pratica guidata.
  total_grammar_units: 52
  total_publishable_articles: 52
  canonical_model: one_grammar_unit -> one_grammar_article
source_of_truth:
  grammar_architecture: _data/situational_grammar.yml
  situation_architecture: _data/situational.yml
  content_mapping: _data/content_mapping.yml
  expression_database: _data/expressions_001-365_clean.yml
  daily_pills: _data/daily_pills.yml
  content_registry: _data/content_registry.yml
  front_matter_source: _data/grammar_articles_front_matter.yml
mission:
  primary_promise: Capire una struttura grammaticale perché serve in una situazione reale e riuscire a usarla.
  learner_profile: Italian-speaking learners from A2 to B2 who want practical, natural English.
  editorial_language: Italian
  target_language: Natural English
  learning_style:
  - context-first
  - function-first
  - natural-not-textbook
  - practical
  - pattern-based
  - guided-practice
  core_question: Quale grammatica mi serve per comunicare correttamente e naturalmente in questa situazione?
core_rules:
  one_grammar_unit_one_article: true
  one_primary_grammar_point_per_article: true
  one_primary_situation_per_article: true
  grammar_is_taught_through_use: true
  context_before_rule: true
  function_before_terminology_when_helpful: true
  natural_english_over_textbook_english: true
  italian_transfer_errors_are_explicit: true
  mapped_situation_is_required: true
  mapped_pills_are_reused_not_duplicated: true
  mapped_expressions_are_reused_not_duplicated: true
  no_standalone_generic_grammar_rubric: true
  no_audio: true
  no_pronunciation_section: true
  babbel_is_secondary_cta: true
url_architecture:
  index_url: /grammar/
  article_url_pattern: /grammar/{grammar_slug}/
  permalink_rule: stable, lowercase, hyphenated, descriptive and unique
  canonical_rule: each grammar article self-canonicalizes to its own permalink
  article_slug_rule: grammar/{source_grammar_slug}
standard_front_matter:
  required_jekyll_fields:
  - layout
  - title
  - description
  - slug
  - permalink
  - published
  - language
  - level
  required_grammar_fields:
  - grammar.id
  - grammar.slug
  - grammar.title
  - grammar.title_it
  - grammar.grammar_point
  - grammar.communicative_function
  - grammar.article_slug
  required_situation_fields:
  - situations.primary_id
  - situations.primary_ids
  - situations.urls
  required_target_language_fields:
  - target_language.core_patterns
  - target_language.natural_examples
  - target_language.italian_traps
  required_learning_design_fields:
  - learning_design.method
  - learning_design.focus
  - learning_design.rule_first
  - learning_design.context_first
  - learning_design.natural_english
  - learning_design.italian_learner_focus
  - learning_design.audio
  - learning_design.pronunciation_focus
  required_article_spec_fields:
  - article_spec.required_sections
  - article_spec.explanation_style
  - article_spec.grammar_tables
  - article_spec.examples_minimum
  - article_spec.mini_dialogue_turns
  - article_spec.guided_practice_exercises
  - article_spec.mini_quiz_questions
  - article_spec.textbook_vs_natural_examples
  required_linking_fields:
  - related_content.situation_ids
  - related_content.expression_ids
  - related_content.pill_days
  required_seo_fields:
  - seo.primary_keyword
  - seo.secondary_keywords
  - seo.meta_title
  - seo.meta_description
  - seo.excerpt
  - seo.canonical
  required_commercial_fields:
  - cta_profile
  - funnel_stage
  - babbel_cta.enabled
  - babbel_cta.position
  - babbel_cta.disclosure_required
standard_learning_design:
  method: 'Situational grammar: explain the grammar through communicative use'
  rule_first: false
  context_first: true
  natural_english: true
  italian_learner_focus: true
  audio: false
  pronunciation_focus: false
  focus:
  - understand the grammar point
  - see when and why native speakers use it
  - connect form to communicative function
  - avoid common Italian transfer mistakes
  - produce the structure in a realistic context
standard_article_spec:
  required_sections:
  - title
  - intro
  - why_this_grammar_matters
  - situation_context
  - meaning_and_form
  - core_pattern
  - natural_examples
  - textbook_vs_natural
  - italian_traps
  - mini_dialogue
  - guided_practice
  - mini_quiz
  - situation_link
  - related_pills
  - related_articles
  - babbel_cta
  explanation_style: short explanations + practical examples
  grammar_tables: true
  examples_minimum: 8
  mini_dialogue_turns: 6-8
  guided_practice_exercises: 4
  mini_quiz_questions: 3
  textbook_vs_natural_examples: 3
  italian_traps_minimum: 3
  related_daily_pills: use all mapped pill days
  related_situation_article: true
grammar_teaching_model:
  sequence:
  - real communicative context
  - notice the pattern
  - explain meaning/function
  - show form
  - contrast with common alternative when useful
  - highlight Italian trap
  - controlled practice
  - personalized production
  rule: The article must never begin as an abstract grammar chapter detached from the situation.
  tables: Use concise tables when they clarify form; never replace contextual explanation with tables alone.
language_model:
  core_patterns: Use the exact source core_patterns as the primary model sentences.
  natural_examples: Use the exact source natural_examples as anchors and add only contextually coherent examples.
  italian_traps: Preserve the source Italian traps and explain them in the article.
  supporting_language: Use supporting vocabulary/expressions only when needed to perform the target communicative function.
  exposure_language: Natural contextual language may appear without becoming a new grammar focus.
textbook_vs_natural:
  required: true
  examples: 3
  purpose: Show a meaningful register, formulation or usage contrast relevant to the grammar point.
  rules:
  - Do not call a grammatically correct sentence wrong merely because another form is more conversational.
  - Explain when each form is appropriate.
  - Keep every example tied to the primary situation.
mini_dialogue:
  required: true
  turns: 6-8
  purpose: Make the grammar point visible inside the target situation.
  rules:
  - Use the target pattern naturally.
  - Do not insert unnatural lines just to display the grammar.
  - Keep the dialogue consistent with the assigned CEFR level.
guided_practice:
  required: true
  exercise_count: 4
  recommended_formats:
  - choose the correct form in context
  - complete a realistic exchange
  - correct a common Italian-transfer error
  - produce a short response using the target pattern
mini_quiz:
  required: true
  questions: 3
  purpose: Check recognition and appropriate use of the target grammar.
relationship_architecture:
  situations:
    role: Primary communicative context.
    rule: One primary situation is required and should be visibly linked.
    link: /situations/{situation_slug}/
  daily_pills:
    role: Micro-language reinforcement.
    rule: Link all mapped pill days where available; do not create duplicate pills.
  expressions:
    role: Language data layer.
    rule: Link mapped expressions when relevant; expression entities remain data-only.
  non_sono_la_stessa_cosa:
    role: Contrastive support.
    rule: Link only if a word/expression distinction materially helps the grammar lesson.
  travel_english:
    role: Domain expansion when the mapped situation is travel-related.
    rule: Grammar teaches the structure; Travel English teaches the broader travel domain.
  business_english:
    role: Domain expansion when the mapped situation is workplace-related.
    rule: Grammar teaches the structure; Business English teaches the professional domain.
  english_culture:
    role: Pragmatic/cultural expansion.
    rule: Link only when context, tone or cultural expectation affects the grammar's use.
  inglese_da_adulti:
    role: Learning-method support.
    rule: Link only when a learning-strategy article genuinely helps the learner use the grammar.
anti_overlap_rules:
  situations: Situation article teaches the whole interaction; Grammar article isolates one primary grammar point needed within
    it.
  daily_pills: Pill teaches one expression; Grammar article teaches a structure/function.
  expressions: Expression database records language entities; Grammar article uses them as examples.
  confusions: Confusion article compares similar language items; Grammar article explains structural form/use.
  travel: Travel is domain-focused; grammar remains structure/function-focused.
  business: Business is domain-focused; grammar remains structure/function-focused.
  culture: Culture explains pragmatic context; grammar explains form/use.
  adult_learning: Adult Learning explains how to learn; Grammar explains what structure to use and why.
seo_rules:
  one_primary_intent: true
  primary_keyword_rule: Target the learner's grammar/use question expressed naturally in Italian.
  secondary_keywords: Stay within the same grammar intent; do not create competing pages for minor variants.
  meta_title: Grammar point + clear practical context.
  meta_description: Explain that the learner will learn the grammar through a real situation with examples and practice.
  canonical: Self-canonical to the grammar article URL.
  indexing: Publishable and indexable unless explicit site QA says otherwise.
pinterest_rules:
  role: Drive qualified traffic to the canonical grammar article.
  recommended_angles:
  - common grammar mistake for Italians
  - grammar in a real situation
  - natural English pattern
  - grammar explained with dialogue
  - Italian vs English usage difference
  destination: Canonical grammar article.
babbel_cta:
  role: Secondary commercial layer.
  position: end_of_article
  profile: solution_soft
  disclosure_required: true
  rules:
  - No unverified pricing.
  - No unverified discounts or offers.
  - No guaranteed outcomes.
  - Do not interrupt the grammar lesson.
  - Verify current commercial details before publication.
writing_prompt_contract:
  input_required:
  - one GRAM record
  - primary SIT record
  - mapped Daily Pill days
  - mapped expression records
  - related grammar IDs
  - site SEO rules
  - Babbel CTA configuration
  writer_must:
  - preserve GRAM ID, title, title_it, level and source slug
  - preserve the canonical permalink /grammar/{slug}/
  - teach exactly one primary grammar point
  - show the grammar in the mapped situation
  - use the supplied core_patterns and natural_examples
  - explain the supplied Italian traps
  - include a 6-8 turn mini-dialogue
  - include at least 8 examples
  - include 3 meaningful textbook-vs-natural contrasts
  - include 4 guided-practice exercises
  - include a 3-question mini-quiz
  - link the mapped situation and relevant Pills
  - finish with the configured soft Babbel CTA and disclosure
  writer_must_not:
  - change the grammar identity or permalink
  - teach multiple competing primary grammar points
  - turn the article into a generic grammar textbook chapter
  - invent a new grammar article for every sub-rule
  - create expression detail pages
  - duplicate the mapped situation article
  - add audio/pronunciation sections
  - force unrelated vertical links
  - invent Babbel offers or commercial claims
quality_assurance:
  pre_publish_checks:
  - Exactly one primary grammar point is taught.
  - GRAM ID and source slug are preserved.
  - Permalink matches /grammar/{slug}/.
  - Primary situation is explicit.
  - CEFR level matches the source.
  - Core patterns are used correctly.
  - Natural examples are accurate and contextual.
  - At least 8 examples are present.
  - Mini-dialogue is 6-8 turns.
  - Three textbook-vs-natural contrasts are meaningful.
  - At least 3 Italian traps are addressed.
  - Four guided-practice exercises are present.
  - Three mini-quiz questions are present.
  - Related mapped Pills are linked.
  - Situation article is linked.
  - SEO metadata is complete.
  - Babbel CTA/disclosure follows configuration.
  - No duplicate grammar route is created.
  - No audio/pronunciation section is introduced.
  status_flow:
  - planned
  - brief_ready
  - drafting
  - draft_ready
  - review
  - approved
  - published
  - needs_update
  - archived
