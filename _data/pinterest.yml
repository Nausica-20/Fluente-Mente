production_defaults:
  educational_content:
    pins_per_core_article: 3
    pins_per_high_pinterest_article: 5
    commercial_pins_per_article: 3
  variation_policy:
    vary_hook: true
    vary_visual_structure: true
    vary_promise: true
    keep_destination_consistent_when_promise_is_same: true
  quality_gate:
  - La promessa del Pin è vera rispetto alla pagina di destinazione.
  - Il Pin comunica valore anche senza il click.
  - Il testo è leggibile su mobile.
  - Il titolo contiene naturalmente il tema principale.
  - Non esiste un Pin quasi identico già pubblicato.
  - Il Pin non usa una promessa commerciale sproporzionata rispetto alla pagina.
