title_strategy: Specific, searchable, readable; avoid mechanical repetition.
canonical_strategy: Use the final published URL as canonical; keep canonical_url null until publication.
schema_types_by_family:
  dialogue: Article
  story: Article
  talking_about: Article
  alternative_ways: Article
taxonomy_indexing:
  family: true
  cluster: true
  topic: false
breadcrumb_strategy:
- Home
- Family
- Cluster
- Article
sitemap_strategy: Include published canonical URLs.
robots_strategy: Index published content; noindex thin utility pages.
