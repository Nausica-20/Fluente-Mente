mission: Create practical English entry points for Italian learners through dialogues, stories, topic speaking guides and natural phrase alternatives.
audience:
  primary: Italian learners of English
  levels:
  - A2
  - A2/B1
  - B1
  - B1/B2
  - B2
  - B2+
content_philosophy:
- Natural English over textbook English
- One primary intent per article
- Useful before promotional
- Pinterest as discovery layer
- Babbel as natural next learning step
content_families:
- dialogue
- story
- talking_about
- alternative_ways
publishing_cadence: 1 article per day
quality_rules:
- No keyword stuffing
- No duplicate search intent
- No artificial synonym lists
- Use contextual English
- Maintain semantic internal links
