# ============================================================
# BRAND
# ============================================================

brand:

  name: "Fluente-Mente"

  short_name: "Fluente-Mente"

  tagline: "Inglese pratico. Inglese reale."

  description: >
    Fluente-Mente aiuta gli adulti a imparare e usare
    l'inglese in modo semplice, pratico e sostenibile.

  primary: "#FF7A00"

  logo_text: "Fluente-Mente"


# ============================================================
# NAVIGAZIONE PRINCIPALE
# ============================================================

navigation:

  main:

    - title: "Home"
      url: "/"

    - title: "Serie"
      url: "/serie/"

    - title: "Blog"
      url: "/blog/"

    - title: "Metodo"
      url: "/metodo/"


  secondary:

    - title: "Chi siamo"
      url: "/chi-siamo/"

    - title: "Contatti"
      url: "/contatti/"


# ============================================================
# SERIE
# ============================================================

series:


  # ----------------------------------------------------------
  # 01 — YOUR DAILY ENGLISH
  # ----------------------------------------------------------

  - id: "your-daily-english"

    number: 1

    title: "Your Daily English"

    tagline: "365 giorni di inglese"

    description: >
      Un piccolo appuntamento quotidiano per imparare
      parole, frasi ed espressioni inglesi utili
      e trasformare l'inglese in una pratica quotidiana.

    short_description: >
      Inglese ogni giorno, un passo alla volta.

    permalink: "/serie/your-daily-english/"

    cluster: "metodo"

    audience: "Adulti che vogliono creare una routine quotidiana di inglese."

    goal: >
      Rendere l'apprendimento dell'inglese una pratica
      semplice, costante e sostenibile.

    format: "Micro-lezioni quotidiane"

    evergreen: true


  # ----------------------------------------------------------
  # 02 — ENGLISH IN REAL LIFE
  # ----------------------------------------------------------

  - id: "english-in-real-life"

    number: 2

    title: "English in Real Life"

    tagline: "L'inglese nelle situazioni reali"

    description: >
      Inglese pratico per affrontare conversazioni,
      situazioni quotidiane e momenti della vita reale
      senza dover tradurre ogni frase mentalmente.

    short_description: >
      Inglese che puoi usare davvero.

    permalink: "/serie/english-in-real-life/"

    cluster: "real-english"

    audience: "Adulti che vogliono usare l'inglese nella vita quotidiana."

    goal: >
      Imparare frasi e strutture attraverso situazioni
      concrete e realistiche.

    format: "Situazioni reali"

    evergreen: true


  # ----------------------------------------------------------
  # 03 — REAL ENGLISH
  # ----------------------------------------------------------

  - id: "real-english"

    number: 3

    title: "Real English"

    tagline: "L'inglese che parlano davvero"

    description: >
      Espressioni, modi di dire, abbreviazioni e forme
      dell'inglese autentico che si incontrano nelle
      conversazioni, nei film, nei social e nella vita reale.

    short_description: >
      Dall'inglese da libro all'inglese reale.

    permalink: "/serie/real-english/"

    cluster: "real-english"

    audience: "Adulti che conoscono l'inglese ma vogliono comprenderlo meglio."

    goal: >
      Avvicinare lo studente all'inglese autentico
      usato dai madrelingua.

    format: "Real English"

    evergreen: true


  # ----------------------------------------------------------
  # 04 — SPEAK ENGLISH WITH CONFIDENCE
  # ----------------------------------------------------------

  - id: "speak-english-with-confidence"

    number: 4

    title: "Speak English with Confidence"

    tagline: "Parlare inglese senza bloccarsi"

    description: >
      Strategie, frasi e tecniche pratiche per parlare
      inglese con maggiore sicurezza, anche quando
      non conosci tutte le parole.

    short_description: >
      Meno paura. Più conversazione.

    permalink: "/serie/speak-english-with-confidence/"

    cluster: "speaking"

    audience: "Adulti che capiscono l'inglese ma fanno fatica a parlarlo."

    goal: >
      Ridurre il blocco mentale e aumentare la sicurezza
      nella conversazione.

    format: "Speaking e confidence"

    evergreen: true


  # ----------------------------------------------------------
  # 05 — ENGLISH MISTAKES ITALIANS MAKE
  # ----------------------------------------------------------

  - id: "english-mistakes-italians-make"

    number: 5

    title: "English Mistakes Italians Make"

    tagline: "Gli errori tipici degli italiani"

    description: >
      Gli errori più comuni che gli italiani fanno
      quando parlano o scrivono in inglese, spiegati
      in modo semplice con esempi pratici.

    short_description: >
      Smetti di tradurre l'italiano parola per parola.

    permalink: "/serie/english-mistakes-italians-make/"

    cluster: "errori"

    audience: "Italiani che studiano o usano l'inglese."

    goal: >
      Riconoscere e correggere gli errori influenzati
      dalla lingua italiana.

    format: "Errori e correzioni"

    evergreen: true


  # ----------------------------------------------------------
  # 06 — 15 MINUTES OF ENGLISH
  # ----------------------------------------------------------

  - id: "15-minutes-of-english"

    number: 6

    title: "15 Minutes of English"

    tagline: "Una micro-routine quotidiana"

    description: >
      Routine brevi e pratiche per migliorare l'inglese
      anche quando hai poco tempo a disposizione.

    short_description: >
      Bastano 15 minuti al giorno.

    permalink: "/serie/15-minutes-of-english/"

    cluster: "metodo"

    audience: "Adulti con poco tempo da dedicare allo studio."

    goal: >
      Creare una routine realistica e sostenibile
      per migliorare l'inglese.

    format: "Micro-routine"

    evergreen: true


  # ----------------------------------------------------------
  # 07 — ENGLISH FOR TRAVEL
  # ----------------------------------------------------------

  - id: "english-for-travel"

    number: 7

    title: "English for Travel"

    tagline: "Inglese pratico per viaggiare"

    description: >
      Frasi, vocaboli e situazioni utili per usare
      l'inglese in aeroporto, hotel, ristorante,
      trasporti e durante il viaggio.

    short_description: >
      Tutto l'inglese che ti serve in viaggio.

    permalink: "/serie/english-for-travel/"

    cluster: "viaggio"

    audience: "Adulti che vogliono viaggiare usando l'inglese."

    goal: >
      Preparare il viaggiatore alle situazioni
      linguistiche più comuni.

    format: "Travel English"

    evergreen: true


  # ----------------------------------------------------------
  # 08 — 1000 ENGLISH PHRASES
  # ----------------------------------------------------------

  - id: "1000-english-phrases"

    number: 8

    title: "1000 English Phrases"

    tagline: "Le frasi inglesi che servono davvero"

    description: >
      Una raccolta progressiva di frasi inglesi utili
      organizzate per situazione, contesto e livello.

    short_description: >
      Impara frasi intere, non singole parole.

    permalink: "/serie/1000-english-phrases/"

    cluster: "vocabolario"

    audience: "Adulti che vogliono ampliare il proprio inglese pratico."

    goal: >
      Costruire un repertorio di frasi immediatamente
      utilizzabili nella comunicazione.

    format: "Frasi pratiche"

    evergreen: true


  # ----------------------------------------------------------
  # 09 — THINK IN ENGLISH
  # ----------------------------------------------------------

  - id: "think-in-english"

    number: 9

    title: "Think in English"

    tagline: "Smettere di tradurre mentalmente"

    description: >
      Strategie ed esercizi per iniziare a pensare
      direttamente in inglese e ridurre la traduzione
      mentale durante la comprensione e la conversazione.

    short_description: >
      Dalla traduzione mentale al pensiero diretto.

    permalink: "/serie/think-in-english/"

    cluster: "mindset"

    audience: "Adulti che conoscono l'inglese ma traducono ancora mentalmente."

    goal: >
      Sviluppare un rapporto più diretto e naturale
      con la lingua inglese.

    format: "Metodo e mindset"

    evergreen: true


  # ----------------------------------------------------------
  # 10 — ENGLISH MADE SIMPLE
  # ----------------------------------------------------------

  - id: "english-made-simple"

    number: 10

    title: "English Made Simple"

    tagline: "L'inglese spiegato semplicemente"

    description: >
      Grammatica, vocaboli e concetti dell'inglese
      spiegati in modo chiaro, pratico e senza
      tecnicismi inutili.

    short_description: >
      Capire l'inglese senza complicarlo.

    permalink: "/serie/english-made-simple/"

    cluster: "grammatica"

    audience: "Adulti che vogliono capire l'inglese senza spiegazioni complicate."

    goal: >
      Rendere semplici i concetti che spesso vengono
      spiegati in modo troppo teorico.

    format: "Spiegazioni semplici"

    evergreen: true


  # ----------------------------------------------------------
  # 11 — ENGLISH AFTER 40
  # ----------------------------------------------------------

  - id: "english-after-40"

    number: 11

    title: "English After 40"

    tagline: "Imparare inglese da adulti"

    description: >
      Strategie, metodo e consigli per imparare
      o migliorare l'inglese dopo i 40 anni,
      con un approccio realistico e sostenibile.

    short_description: >
      Imparare una lingua non ha età.

    permalink: "/serie/english-after-40/"

    cluster: "english-after-40"

    audience: "Adulti 40+ che vogliono imparare o migliorare l'inglese."

    goal: >
      Dimostrare che imparare l'inglese da adulti
      è possibile con un metodo adatto alla propria vita.

    format: "Adult English Learning"

    evergreen: true


# ============================================================
# CLUSTER EDITORIALI
# ============================================================

clusters:


  - id: "beginner"
    title: "Inglese per principianti"
    description: >
      Le basi dell'inglese spiegate in modo semplice
      e pratico.
    permalink: "/cluster/beginner/"


  - id: "real-english"
    title: "Real English"
    description: >
      Inglese autentico, conversazioni ed espressioni
      usate nella vita reale.
    permalink: "/cluster/real-english/"


  - id: "speaking"
    title: "Parlare inglese"
    description: >
      Strategie e strumenti per parlare inglese
      con maggiore sicurezza.
    permalink: "/cluster/speaking/"


  - id: "grammatica"
    title: "Grammatica pratica"
    description: >
      La grammatica inglese spiegata attraverso
      esempi e situazioni concrete.
    permalink: "/cluster/grammatica/"


  - id: "vocabolario"
    title: "Vocabolario pratico"
    description: >
      Parole, espressioni e frasi utili
      per comunicare meglio.
    permalink: "/cluster/vocabolario/"


  - id: "viaggio"
    title: "Inglese per viaggiare"
    description: >
      Inglese pratico per aeroporti, hotel,
      ristoranti e situazioni di viaggio.
    permalink: "/cluster/viaggio/"


  - id: "business"
    title: "Business English"
    description: >
      Inglese utile per lavoro, riunioni,
      email e situazioni professionali.
    permalink: "/cluster/business/"


  - id: "metodo"
    title: "Metodo"
    description: >
      Strategie, routine e tecniche per imparare
      l'inglese in modo efficace e sostenibile.
    permalink: "/cluster/metodo/"


  - id: "mindset"
    title: "Mindset"
    description: >
      Mentalità, motivazione e strategie per
      superare i blocchi nell'apprendimento.
    permalink: "/cluster/mindset/"


  - id: "errori"
    title: "Errori degli italiani"
    description: >
      Gli errori più frequenti degli italiani
      quando imparano e usano l'inglese.
    permalink: "/cluster/errori/"


  - id: "english-after-40"
    title: "English After 40"
    description: >
      Strategie e metodi per imparare l'inglese
      da adulti.
    permalink: "/cluster/english-after-40/"


