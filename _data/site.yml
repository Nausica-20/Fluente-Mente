  disclosure_short_label: Link affiliato
footer:
  copyright: CONFIGURE
  show_affiliate_disclosure: true
  show_privacy_link: true
  show_cookie_link: true
  show_contact_link: true
  show_last_updated: true
legal:
  privacy_url: /privacy/
  cookie_url: /cookie/
  terms_url: CONFIGURE
  affiliate_disclosure_url: /affiliate-disclosure/
  editorial_policy_url: /editorial-policy/
social:
  pinterest:
    enabled: true
    profile_url: https://pin.it/7AH50mTlA
    default_source: pinterest
    username: nausica-20
analytics:
  provider: CONFIGURE
  tracking_id: CONFIGURE
  consent_mode: CONFIGURE
  notes: Configurare in base agli strumenti effettivamente usati e ai requisiti applicabili.
technical:
  static_hosting: GitHub Pages
  build_system: Jekyll
  deployment: GitHub Actions
  ssl: true
  custom_domain: false
  generate_sitemap: true
  generate_robots: true
  atom_feed: true
  image_optimization: true
  broken_link_check: true
global_defaults:
  content_language: it
  date_format: DD/MM/YYYY
  default_author: CONFIGURE
  default_image: /assets/images/default-og.jpg
  default_og_type: website
  breadcrumb_enabled: true
  search_enabled: true
  related_content_enabled: true
  learning_path_module_enabled: true
  affiliate_module_enabled: true
url_conventions:
  article: /{{section}}/{{slug}}/
  cluster: /{{section}}/{{cluster_slug}}/
  path: /paths/{{path_slug}}/
  word: /words/{{word_slug}}/
  expression: /expressions/{{expression_slug}}/
  static_page: /{{slug}}/
environment:
  development:
    base_url: http://localhost:4000
    robots: noindex,nofollow
    analytics: false
  production:
    base_url: https://nausica-20.github.io/fluente-mente/
    robots: index,follow
    analytics: true
governance:
  source_of_truth_files:
  - _data/content.yml
  - _data/clusters.yml
  - _data/topics.yml
  - _data/learning_paths.yml
  - _data/ctas.yml
  - _data/pinterest.yml
  - _data/affiliate.yml
  - _data/seo.yml
  - _data/site.yml
  content_copy_should_not_be_hardcoded_in_templates: true
  commercial_copy_should_be_managed_in_ctas_or_affiliate_config: true
  seo_copy_should_be_managed_in_content_or_seo_config: true
  navigation_should_be_managed_in_site_config: true
  style_reference: design_system in site.yml is derived from the supplied Fluente-Mente project
  style_rule: Keep the visual system consistent across the new site; change information architecture, copy, content and branding
    as required by the Babbel acquisition project, not the underlying visual language.
design_system:
  reference: Fluente-Mente GitHub/Jekyll project supplied by user
  preserve_visual_language: true
  principles:
  - editorial
  - clean
  - warm
  - premium_without_being_luxury
  - high_readability
  - content_first
  - soft_cards
  - subtle_motion
  colors:
    text: '#202124'
    text_muted: '#5f6368'
    background: '#ffffff'
    background_soft: '#fff7ed'
    border: '#e5e1d8'
    primary_navy: '#183b56'
    primary_navy_dark: '#102c40'
    accent_orange: '#f26b38'
    accent_orange_dark: '#d95728'
    primary_soft: '#edf3f7'
    accent_soft: '#fff0e9'
    footer_background: '#183b56'
  typography:
    font_stack:
    - Inter
    - -apple-system
    - BlinkMacSystemFont
    - Segoe UI
    - Roboto
    - Helvetica
    - Arial
    - sans-serif
    heading_weight: 700
    body_weight: 400
    nav_weight: 600
    base_size: 1rem
    body_line_height: 1.65
    heading_line_height: 1.2
    display_letter_spacing: -0.035em
  layout:
    container_max_width: 1180px
    reading_max_width: 760px
    sidebar_width: 260px
    header_height: 76px
    section_spacing: 5rem
    mobile_section_spacing: 3rem
  shape:
    border_width: 1px
    radius_sm: 6px
    radius_md: 12px
    radius_lg: 20px
    radius_xl: 28px
    radius_pill: 999px
  elevation:
    small: 0 1px 3px rgba(0, 0, 0, 0.06)
    medium: 0 8px 24px rgba(0, 0, 0, 0.08)
    large: 0 16px 40px rgba(0, 0, 0, 0.10)
  components:
    header: white background, thin bottom border, compact horizontal navigation
    mobile_navigation: pill menu button with rounded dropdown
    hero: two-column editorial hero with strong H1 and simple visual card
    cards: white cards, thin warm border, rounded corners, subtle shadow, slight lift on hover
    featured_card: deep navy surface with white text and orange accent
    eyebrows: small uppercase labels with letter spacing
    buttons: rounded, compact, high-contrast primary and outlined secondary
    articles: wide editorial header, readable 760px text column, generous spacing
    callouts: soft warm/blue backgrounds with left accent border
    footer: deep navy background, four-column desktop structure, legal row at bottom
  motion:
    enabled: true
    duration_fast: 150ms
    duration_base: 250ms
    hover_transform: translateY(-2px) to translateY(-4px)
    respect_prefers_reduced_motion: true
  responsive:
    breakpoints:
      sm: 576px
      md: 768px
      lg: 1024px
      xl: 1200px
    mobile_navigation_at: 1024px
    article_sidebar_collapses_at: 1024px
    card_grid_collapses_at: 768px
  image_direction:
    style: clean editorial, minimal, authentic, no generic stock-photo look
    corners: rounded to match card system
    preferred_ratio: 4:3 or 16:10 for website editorial images
    pinterest_ratio: '2:3'
    overlays: use typography and simple graphic framing rather than heavy decoration
github:
  username: nausica-20
  repository: fluente-mente
  repository_full: nausica-20/fluente-mente
  pages_url: https://nausica-20.github.io/fluente-mente/
