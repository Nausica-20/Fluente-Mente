  - career_guide
  - writing_guide
  - media_language
  - internet_language
  - real_world_language
  - myth_buster
  - mini_story
  - how_to
  - explainer
  primary_purposes:
  - communication
  - naturalness
  - fluency
  - comprehension
  - culture
  - travel_survival
  - work_communication
  - writing
  - confidence
  - real_world_recognition
  search_intents:
  - informational
  - practical
  - comparative
  - meaning
  - how_to
  - scenario
  - cultural
  babbel_cta_levels:
  - none
  - soft
  - contextual
  - direct
  statuses:
  - planned
  - briefed
  - drafting
  - review
  - approved
  - published
  - needs_update
  - archived
  schema_types:
  - Article
  - HowTo
  - FAQPage
  relationship_types:
    natural_extension: Deepens the same learner problem from a different editorial angle.
    cultural_context: Explains cultural context behind language or behaviour.
    practical_application: Applies previously learned language to a concrete situation.
    confidence_strategy: Provides a complementary speaking or communication strategy.
    real_world_example: Shows how the language appears in authentic real-world use.
    travel_application: Applies the concept to a travel situation.
    work_application: Applies the concept to work or professional life.
    deeper_dive: Provides a deeper explanation of a concept already introduced.
    same_theme_extension: Explores the same macro-theme from a distinct angle.
    next_step: A logical next article for the reader's learning journey.
planning_rules:
  annual_capacity:
    total_days: 365
    editorial_articles: 364
    annual_special: 1
  weekly_distribution:
    weeks: 52
    articles_per_week: 7
  rubric_distribution:
    english-in-real-life: 52
    natural-english: 52
    english-mindset: 52
    english-culture: 52
    english-for-adventure: 52
    english-for-life-work: 52
    english-from-the-real-world: 52
  special_day:
    day: 365
    type: annual_special
    recommended_title: '365 Days of Real English: What You Can Do Now That You Couldn''t Do a Year Ago'
  completed_weeks:
  - 1
  - 2
  - 3
  - 4
  - 5
anti_duplication_rules:
  required_before_publish:
  - A new article must have exactly one primary rubric.
  - A new article must have exactly one primary macro theme.
  - The unique_angle must be materially different from existing articles.
  - The primary purpose must not be duplicated within the same topic unless the angle and learner problem are clearly different.
  - Core concepts must be checked against existing concept_ids.
  - Expressions should not be reused as the main teaching asset unless the context or meaning is substantially different.
  - The same situation should not produce multiple articles unless the reader problem, outcome, or editorial lens is materially
    different.
  - Do not create a new article solely by changing the title, examples, or wording of an existing article.
  - Cross-rubric overlap is allowed only when the rubric's mission changes the teaching objective.
  - Babbel CTA content must never replace the article's primary educational purpose.
  recommended_thresholds:
    same_core_concepts_max: 0
    same_primary_intent_same_topic_max: 1
    same_primary_expression_as_main_asset_max: 1
  internal_linking:
    required:
    - Every article must have a primary pillar.
    - Every internal link must have an explicit relationship type.
    - A link must provide a clear reason for the reader to continue.
    - Do not create links solely because two articles share keywords.
    - Avoid linking articles that substantially repeat the same explanation.
    - Cross-rubric links are encouraged when they provide a genuinely different perspective.
    - The visible continuation section should normally contain 3-5 editorial links maximum.
    preferred_distribution:
      pillar: 1
      same_week: 0-2
      same_rubric: 0-1
      same_theme: 0-1
      cross_rubric: 0-1
workflow:
  step_1: Select rubric from rubrics.yml.
  step_2: Select macro_theme from macro_themes.yml.
  step_3: Define learner problem and unique_angle.
  step_4: Check concept, expression, situation, topic and internal-link overlap.
  step_5: Assign content_type, primary_purpose, level and search_intent.
  step_6: Create SEO metadata, Pinterest hook and internal-link relationships.
  step_7: Assign Babbel CTA only when contextually appropriate and keep it separate from editorial linking.
  step_8: Review uniqueness and internal-link usefulness before drafting.
  step_9: Draft and editorially review.
  step_10: Publish and update registry status.
relationship_rules:
  rubrics_file: data/rubrics.yml
  macro_themes_file: data/macro_themes.yml
  future_registry_population: 364 editorial records + 1 annual special record
  babbel_section: Separate commercial vertical; do not classify Babbel pages as editorial rubric articles.
