schema_version: '1.0'
project: Fluente-Mente
purpose: Master editorial registry for 365 days of unique English-learning content.
content_model:
  id: FM-001 ... FM-365
  day: 1
  week: 1
  rubric: slug from rubrics.yml
  macro_theme: slug from macro_themes.yml
  title: Article title
  slug: url-friendly-slug
  content_type: one allowed value from taxonomy.content_types
  primary_purpose: one allowed value from taxonomy.primary_purposes
  unique_angle: What makes this article materially different from all existing content.
  audience:
    primary: Italian learners of English
    profile: adult_general
  level: one allowed value from taxonomy.levels
  search_intent: one allowed value from taxonomy.search_intents
  keywords:
    primary: ''
    secondary: []
    long_tail: []
  core_concepts: []
  target_language:
    expressions: []
    grammar_points: []
    vocabulary_groups: []
    cultural_points: []
  forbidden_overlap: []
  related_content:
    pillar: null
    previous: []
    next: []
    cross_rubric: []
    cross_theme: []
  seo:
    meta_title: ''
    meta_description: ''
    canonical: ''
    schema_type: Article
  pinterest:
    primary_hook: ''
    pin_titles: []
    visual_angles: []
    cta_type: read_article
  babbel:
    enabled: false
    cta_level: none
    cta_angle: ''
    destination: /babbel/
  editorial:
    status: planned
    author: Fluente-Mente
    estimated_read_minutes: 6
    evergreen: true
  anti_duplication:
    concept_ids: []
    expression_ids: []
    situation_ids: []
    excluded_article_ids: []
    uniqueness_check: pending
  internal_links:
    pillar: Primary pillar for the article.
    same_week: Optional links to complementary articles in the same 7-day theme.
    same_rubric: Links to complementary content in the same editorial rubric.
    same_theme: Links to complementary content on the same macro-theme from another week.
    cross_rubric: Links to a different rubric when it provides a genuinely complementary perspective.
    visible_limit: Show no more than 3-5 editorial links in the article's main continuation area.
  internal_link_record:
    id: FM-000
    relationship: one allowed value from taxonomy.relationship_types
    priority: 1
    anchor_intent: Why the reader would want to click this link.
