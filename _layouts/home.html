---
layout: default
---

<section class="hero">

  <div class="container hero-inner">

    <span class="hero-label">
      {{ site.data.site.brand.name }}
    </span>

    <h1>
      {{ page.title }}
    </h1>

    {% if page.description %}

      <p class="hero-description">
        {{ page.description }}
      </p>

    {% endif %}

    {% if page.cta_url %}

      <a
        class="button button-primary"
        href="{{ page.cta_url | relative_url }}"
      >
        {{ page.cta_text }}
      </a>

    {% endif %}

  </div>

</section>


{{ content }}
