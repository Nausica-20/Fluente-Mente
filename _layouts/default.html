<!doctype html>
<html lang="{{ site.data.site.site.language | default: site.lang | default: 'it' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.data.site.site.name | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.data.site.site.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}{% feed_meta %}
</head>
<body class="page">
  <a class="skip-link" href="#main-content">Vai al contenuto</a>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body></html>
